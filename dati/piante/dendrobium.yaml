schema_version: 1
id: dendrobium
stato: bozza
nome_scientifico: Dendrobium nobile
famiglia: Orchidaceae
nomi_comuni:
  it: [Dendrobium, Orchidea bambù]
  en: [Noble dendrobium, Dendrobium nobile]
descrizione: >-
  Orchidea con fusti eretti a canna, ingrossati e divisi in nodi, con foglie
  sulla parte alta. A fine inverno si copre di fiori rosa e bianchi a coppie
  lungo le canne. Per fiorire vuole un inverno fresco e asciutto.
categorie: [appartamento, fiorita]
gruppo: orchidee
ambiente:
  interno: true
  esterno: estate
  terrarium: "no"
  note: >-
    Da maggio a settembre può stare in balcone a mezz'ombra; in autunno va
    tenuta al fresco (10-15 °C), ma al riparo dal gelo.
difficolta: 3
luce:
  ideale: intensa_indiretta
  tollera: [sole_diretto, media_indiretta]
  sole_diretto: solo_mattino
  esposizione: [est, sud, ovest]
  note: Vuole molta luce, anche il sole del mattino; con poca luce fa solo foglie e non fiorisce.
annaffiatura:
  quando: In crescita quando il substrato è quasi asciutto; da ottobre a febbraio solo se le canne si raggrinziscono.
  primavera_estate: { min: 4, max: 7 }
  autunno_inverno: { min: 14, max: 21 }
  metodo: Annaffiare a fondo o immergere il vaso e lasciarlo sgocciolare; d'estate nebulizzare le foglie.
  acqua: Meglio acqua piovana o poco calcarea.
  segnali_troppa: Canne molli e scure alla base, foglie gialle che cadono.
  segnali_poca: Canne raggrinzite e giallastre.
umidita: media
concimazione:
  mesi: [4, 5, 6, 7, 8, 9]
  frequenza_giorni: { min: 14, max: 21 }
  tipo: Concime liquido per orchidee a dose ridotta; stop da ottobre per avere fiori e non nuove piantine.
temperatura:
  min_c: 8
  ideale_min_c: 15
  ideale_max_c: 28
  note: Il riposo fresco (10-15 °C) e asciutto da ottobre a gennaio è ciò che fa nascere i boccioli.
terreno: Corteccia di pino media per orchidee, in un vaso piccolo e ben drenato.
rinvaso: Ogni 2-3 anni in primavera, quando spuntano le canne nuove; vaso appena più grande.
propagazione: [polloni, divisione, talea_fusto]
come_si_propaga:
  - metodo: polloni
    quando: In primavera o estate, quando il keiki ha radici lunghe almeno 3-5 cm.
    passi:
      - Aspetta che la piantina (keiki) nata sulla canna abbia 2-3 foglie e qualche radice lunga 3-5 cm.
      - Staccala con una leggera torsione o tagliala con un coltello disinfettato con alcol, con un pezzetto di canna.
      - Mettila in un vasetto di 6-8 cm con corteccia fine per orchidee, fermandola con un tutore se dondola.
      - Tieni in luce luminosa ma filtrata e nebulizza ogni 2-3 giorni finché le radici entrano nella corteccia.
      - Bagna quando la corteccia è quasi asciutta, come una pianta adulta.
    tempo: Si assesta in 4-6 settimane; fiorisce dopo 1-2 anni.
    difficolta: facile
  - metodo: divisione
    quando: In primavera, quando spuntano le canne nuove alla base.
    passi:
      - Sfila la pianta dal vaso ed elimina la vecchia corteccia e le radici marce o vuote.
      - Dividi il cespo con un coltello disinfettato in porzioni di almeno 3-4 canne, ognuna con radici sane e un germoglio nuovo.
      - Metti ogni porzione in un vaso piccolo con corteccia per orchidee, con le canne vecchie verso il bordo.
      - Lega le canne a un tutore e aspetta una settimana prima di bagnare, nebulizzando nel frattempo.
    tempo: Riprende in 4-8 settimane.
    difficolta: media
    note: Le porzioni troppo piccole fanno fatica e possono non fiorire per un paio d'anni.
  - metodo: talea_fusto
    quando: Da maggio a luglio, con caldo e umidità.
    passi:
      - Taglia una canna vecchia e senza foglie alla base, con un coltello disinfettato.
      - Dividila in pezzi di 10-15 cm, ognuno con almeno 2-3 nodi.
      - Appoggia i pezzi sdraiati su sfagno umido in una vaschetta con coperchio trasparente.
      - Tieni a 22-27 °C in luce luminosa ma filtrata, aprendo il coperchio ogni giorno per qualche minuto.
      - Quando dai nodi spuntano piantine con radici di 3-5 cm, staccale e invasale come i keiki.
    tempo: Piantine dai nodi in 2-4 mesi.
    difficolta: difficile
tossicita:
  animali: non_tossica
  persone: non_tossica
  note: Secondo l'ASPCA le orchidee Dendrobium non sono tossiche per cani e gatti.
problemi_comuni:
  - sintomo: Spuntano piantine (keiki) sulle canne invece dei fiori
    causa: Troppa acqua, concime o caldo in inverno
    rimedio: Rispettare il riposo fresco e asciutto; le piantine con radici si possono staccare e invasare.
  - sintomo: Non fiorisce
    causa: Poca luce o inverno troppo caldo
    rimedio: Più luce e un autunno al fresco, con poca acqua e niente concime.
  - sintomo: Canne vecchie senza foglie
    causa: È normale dopo uno o due anni
    rimedio: Non tagliarle, possono ancora fiorire e fanno da riserva.
immagini:
  - commons: "Dendrobium nobile (BG Zurich)-01.JPG"
fonti:
  - Royal Horticultural Society, scheda Dendrobium nobile (rhs.org.uk)
  - ASPCA, elenco piante tossiche e non tossiche (aspca.org)
  - American Orchid Society, scheda di coltivazione dei Dendrobium (aos.org)
autori: [piantalapp]
aggiornato: "2026-10-23"
