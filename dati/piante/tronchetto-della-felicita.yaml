schema_version: 1
id: tronchetto-della-felicita
stato: bozza
nome_scientifico: Dracaena fragrans
sinonimi:
- Dracaena massangeana
famiglia: Asparagaceae
nomi_comuni:
  it:
  - Tronchetto della felicità
  - Dracena fragrans
  en:
  - Corn plant
  - Happy plant
  - Mass cane
descrizione: Uno o più tronchi da cui spuntano ciuffi di foglie lunghe, verdi con
  una striscia gialla al centro. Classica pianta da regalo.
categorie:
- appartamento
- da_ufficio
gruppo: appartamento
ambiente:
  interno: true
  esterno: estate
  terrarium: 'no'
  note: In casa tutto l'anno; in estate può stare fuori all'ombra, al riparo dal
    vento.
difficolta: 1
luce:
  ideale: media_indiretta
  tollera:
  - bassa
  - intensa_indiretta
  sole_diretto: 'no'
  esposizione:
  - nord
  - est
  - ovest
annaffiatura:
  quando: Quando metà del terriccio è asciutta; non lasciare mai acqua nel sottovaso.
  primavera_estate:
    min: 10
    max: 14
  autunno_inverno:
    min: 18
    max: 25
  segnali_troppa: Foglie gialle e molli, terriccio che resta bagnato.
  segnali_poca: Foglie flosce o che si arricciano, bordi secchi.
umidita: media
concimazione:
  mesi:
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  frequenza_giorni:
    min: 15
    max: 30
  tipo: Concime liquido per piante verdi a metà dose.
temperatura:
  min_c: 12
  ideale_min_c: 18
  ideale_max_c: 27
terreno: Terriccio universale con perlite o corteccia.
rinvaso: Ogni 2 anni in primavera, in un vaso appena più grande.
propagazione:
- talea_fusto
- margotta
come_si_propaga:
- metodo: talea_fusto
  quando: In primavera o all'inizio dell'estate.
  passi:
  - Taglia una punta di 10-15 cm con 3-4 foglie, appena sotto un nodo.
  - Togli le foglie basse e, se vuoi, intingi il taglio in ormone radicante.
  - Interrala in un mix di torba e perlite e annaffia leggermente.
  - Copri con un sacchetto trasparente e tieni al caldo (22-25 °C) e alla luce indiretta.
  - Arieggia ogni pochi giorni; quando spuntano foglie nuove togli il sacchetto.
  tempo: Radici in 4-8 settimane.
  difficolta: facile
- metodo: margotta
  quando: Da maggio a luglio.
  passi:
  - Scegli un ramo o un fusto legnoso e incidi la corteccia per 1-2 cm sotto un
    nodo.
  - Avvolgi la ferita con sfagno umido e chiudi con pellicola legata sopra e sotto.
  - Controlla che lo sfagno resti umido; quando vedi le radici, taglia sotto la
    margotta.
  - Interra la nuova pianta in un vaso e tienila riparata per qualche settimana.
  tempo: Radici in 6-10 settimane.
  difficolta: media
tossicita:
  animali: tossica
  persone: lieve
  note: 'Contiene saponine: per cani e gatti provoca vomito e salivazione.'
problemi_comuni:
- sintomo: Punte e bordi delle foglie marroni e secchi
  causa: Aria troppo secca o acqua calcarea
  rimedio: Vaporizzare, usare un sottovaso con argilla umida e annaffiare con acqua
    piovana o demineralizzata.
- sintomo: Batuffoli bianchi o scudetti sui rami
  causa: Cocciniglia
  rimedio: Togliere con un cotton fioc imbevuto di alcol e trattare con olio bianco
    o sapone molle.
