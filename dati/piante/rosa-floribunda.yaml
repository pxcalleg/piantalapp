schema_version: 1
id: rosa-floribunda
stato: bozza
nome_scientifico: "Rosa × hybrida (Floribunda)"
famiglia: Rosaceae
nomi_comuni:
  it: [Rosa floribunda, Rosa a mazzi]
  en: [Floribunda rose, Cluster-flowered rose]
descrizione: >-
  Cespuglio compatto che porta i fiori a mazzetti e rifiorisce quasi senza
  sosta fino all'autunno. Varietà famose sono 'Iceberg' (Schneewittchen),
  'Frensham', 'Queen Elizabeth' e 'Sangerhäuser Jubiläumsrose'. Ideale per
  aiuole e vasi.
categorie: [esterno, balcone, fiorita, pet_friendly]
gruppo: esterno
ambiente:
  interno: false
  esterno: tutto_anno
  terrarium: "no"
  note: >-
    Pianta da esterno; sta bene anche in vaso (almeno 30 litri) su un
    balcone soleggiato.
difficolta: 2
luce:
  ideale: sole_diretto
  tollera: [intensa_indiretta]
  sole_diretto: si
  esposizione: [sud, est, ovest]
  note: >-
    Servono almeno 6 ore di sole diretto al giorno per fiorire bene. Nelle
    estati molto calde gradisce un po' d'ombra nelle ore centrali.
annaffiatura:
  quando: Quando i primi 3-4 cm di terriccio sono asciutti al tatto.
  primavera_estate: { min: 2, max: 4 }
  autunno_inverno: { min: 10, max: 21 }
  metodo: >-
    Annaffiare a fondo alla base, al mattino o alla sera, fino a far uscire
    l'acqua dal foro del vaso. Non bagnare le foglie, per prevenire le malattie
    fungine. In piena estate, in vaso, può servire acqua ogni giorno.
  acqua: Va bene l'acqua del rubinetto; meglio ancora quella piovana.
  segnali_troppa: Foglie che ingialliscono dal basso e cadono, terriccio sempre bagnato.
  segnali_poca: Foglie e boccioli mosci, petali che seccano in fretta.
umidita: media
concimazione:
  mesi: [3, 4, 5, 6, 7, 8]
  frequenza_giorni: { min: 14, max: 21 }
  tipo: Concime per rose o per piante da fiore, ricco di potassio.
  note: >-
    Smettere a fine agosto, perché i getti nuovi abbiano il tempo di
    indurirsi prima dell'inverno.
temperatura:
  min_c: -12
  ideale_min_c: 15
  ideale_max_c: 28
  note: >-
    In piena terra è molto rustica; in vaso le radici gelano più facilmente,
    quindi d'inverno conviene proteggere il vaso.
terreno: >-
  Terriccio specifico per rose o terriccio universale ricco con un terzo di
  terra di campo e un po' di stallatico maturo; strato drenante sul fondo.
rinvaso: >-
  Ogni 2-3 anni a fine inverno, in un vaso più grande. Potatura a fine
  inverno: accorciare i rami di circa metà.
propagazione: [talea_fusto]
come_si_propaga:
  - metodo: talea_fusto
    quando: Tra fine giugno e settembre, con rami dell'anno semi-maturi (ancora flessibili ma già induriti alla base); in alternativa a ottobre-novembre con rami legnosi.
    passi:
      - Scegli un ramo sano che ha appena fiorito e taglia un pezzo di 15-20 cm, con forbici pulite e affilate.
      - Taglia la base appena sotto un nodo e la cima appena sopra un nodo, togliendo il fiore appassito.
      - Elimina tutte le foglie tranne le due più in alto e rimuovi le spine nella parte bassa.
      - Intingi la base in ormone radicante in polvere e infilala per due terzi in un vaso con metà terriccio e metà sabbia o perlite.
      - Annaffia, copri il vaso con un sacchetto di plastica trasparente e tienilo alla luce ma non al sole diretto, a 18-22 °C.
      - Quando spuntano foglie nuove e la talea resiste a un leggero tiro, trapiantala in un vaso singolo con terriccio per rose.
    tempo: Radici in 6-8 settimane per le talee estive; quelle autunnali radicano entro la primavera successiva.
    difficolta: media
    note: Le floribunde radicano di solito meglio delle tea ibride. Molte piante in vivaio sono innestate e le talee danno piante su radici proprie, un po' più lente il primo anno. Le varietà brevettate non si possono moltiplicare per venderle.
tossicita:
  animali: non_tossica
  persone: non_tossica
  note: >-
    Secondo l'ASPCA la rosa non è tossica per cani e gatti; attenzione però
    alle spine, che possono ferire bocca e zampe.
problemi_comuni:
  - sintomo: Macchie nere tonde sulle foglie, che poi ingialliscono e cadono
    causa: Ticchiolatura (macchia nera), un fungo favorito dalle foglie bagnate
    rimedio: Togliere e buttare le foglie colpite, annaffiare solo alla base e arieggiare; a inizio primavera un trattamento a base di rame.
  - sintomo: Polvere bianca su foglie e boccioli
    causa: Oidio (mal bianco), con giornate calde e notti umide
    rimedio: Eliminare le parti colpite e migliorare l'aerazione; zolfo o bicarbonato di potassio nei casi diffusi.
  - sintomo: Colonie di insetti verdi sui germogli e sui boccioli
    causa: Afidi
    rimedio: Getto d'acqua o sapone molle potassico; coccinelle e altri predatori aiutano.
immagini:
  - commons: 'Floribunda - Frensham 05 (b).JPG'
fonti:
  - Royal Horticultural Society, guide "Roses" e "Roses in containers" (rhs.org.uk)
  - ASPCA, elenco piante tossiche e non tossiche, voce Rose (aspca.org)
  - University of Minnesota Extension, "Growing roses" (extension.umn.edu)
  - Clemson Cooperative Extension, "Roses" (hgic.clemson.edu)
autori: [piantalapp]
aggiornato: "2026-10-23"
