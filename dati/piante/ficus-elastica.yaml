schema_version: 1
id: ficus-elastica
stato: bozza
nome_scientifico: Ficus elastica
famiglia: Moraceae
nomi_comuni:
  it: [Ficus robusta, Ficus elastica, Albero della gomma]
  en: [Rubber plant, Rubber fig]
descrizione: >-
  Pianta dalle grandi foglie ovali, spesse e lucide, verde scuro o
  variegate. In casa diventa un alberello alto anche due metri ed è più
  tollerante del Ficus benjamina.
categorie: [appartamento, da_ufficio]
ambiente:
  interno: true
  esterno: estate
  terrarium: "no"
  note: >-
    D'estate può stare all'aperto in mezz'ombra, abituandola gradualmente;
    va ritirata quando la notte scende sotto i 12 °C.
difficolta: 2
luce:
  ideale: intensa_indiretta
  tollera: [media_indiretta]
  sole_diretto: solo_mattino
  esposizione: [est, ovest, sud]
  note: >-
    Con poca luce perde le foglie basse e allunga i fusti; le varietà
    variegate hanno bisogno di ancora più luce.
annaffiatura:
  quando: Quando i primi 3-5 cm di terriccio sono asciutti.
  primavera_estate: { min: 7, max: 10 }
  autunno_inverno: { min: 14, max: 21 }
  metodo: Bagnare a fondo e svuotare il sottovaso dopo 15 minuti.
  acqua: Acqua a temperatura ambiente.
  segnali_troppa: Foglie basse che ingialliscono e cadono, macchie scure sulle foglie.
  segnali_poca: Foglie che pendono verso il basso e si accartocciano.
umidita: media
concimazione:
  mesi: [3, 4, 5, 6, 7, 8, 9]
  frequenza_giorni: { min: 21, max: 30 }
  tipo: Concime liquido bilanciato per piante verdi a metà dose.
  note: Sospendere in autunno e inverno.
temperatura:
  min_c: 12
  ideale_min_c: 16
  ideale_max_c: 27
  note: Teme le correnti fredde e i termosifoni vicini.
terreno: Terriccio universale con un 20-30% di perlite o corteccia per il drenaggio.
rinvaso: Ogni 2-3 anni in primavera, in un vaso appena più grande e pesante.
propagazione: [talea_fusto, margotta]
come_si_propaga:
  - metodo: talea_fusto
    quando: Da maggio a luglio, con il caldo e la pianta in piena crescita.
    passi:
      - Taglia con un coltello affilato e pulito una punta di 15-20 cm con 2-3 foglie, appena sotto un nodo.
      - Sciacqua il taglio sotto l'acqua tiepida finché il lattice smette di uscire e lascialo asciugare per un'ora.
      - Riduci le foglie a 2, e se sono molto grandi arrotolale o tagliale a metà per ridurre la perdita d'acqua.
      - Immergi la base in ormone radicante e interrala in un vasetto con torba e perlite in parti uguali, legandola a un bastoncino se serve.
      - Copri con un sacchetto trasparente, tieni a 22-25 °C in luce indiretta e rinvasa in terriccio normale quando spuntano foglie nuove.
    tempo: Radici in 4-8 settimane.
    difficolta: media
    note: Il lattice bianco irrita pelle e occhi, quindi usa i guanti. La talea si può anche far radicare in un vaso d'acqua, cambiandola ogni settimana.
  - metodo: margotta
    quando: In primavera o inizio estate, su un fusto o ramo legnoso.
    passi:
      - Scegli il punto dove vuoi le radici, 30-40 cm sotto la punta, e togli un anello di corteccia largo 1-2 cm con un coltellino pulito.
      - Spolvera la ferita con ormone radicante e avvolgila con una grossa manciata di sfagno bagnato e strizzato.
      - Chiudi lo sfagno con pellicola trasparente legata sopra e sotto, per tenerlo umido e vedere le radici.
      - Controlla ogni settimana e inumidisci lo sfagno con una siringa se si asciuga.
      - Quando le radici riempiono lo sfagno, taglia il fusto sotto la margotta e invasa la nuova pianta senza togliere lo sfagno.
    tempo: Radici in 6-10 settimane.
    difficolta: media
    note: È il metodo più sicuro per il Ficus elastica, perché il ramo resta nutrito dalla pianta madre finché ha le sue radici. La pianta madre, cimata, rimette rami laterali.
tossicita:
  animali: tossica
  persone: lieve
  note: Il lattice bianco irrita pelle e mucose; tossica per cani e gatti se ingerita.
problemi_comuni:
  - sintomo: Foglie basse che cadono una dopo l'altra
    causa: Poca luce o troppa acqua
    rimedio: Avvicinarla a una finestra luminosa e annaffiare solo con terriccio asciutto in superficie.
  - sintomo: Foglie opache e impolverate
    causa: Polvere che riduce la fotosintesi
    rimedio: Pulire le foglie con un panno umido ogni due settimane.
  - sintomo: Pianta lunga e spoglia con un solo fusto
    causa: Crescita naturale senza potature
    rimedio: Cimare la punta in primavera per far partire rami laterali.
immagini:
  - commons: "Gummibaum (Ficus elastica Robusta).jpg"
fonti:
  - Royal Horticultural Society, scheda Ficus elastica (rhs.org.uk)
  - ASPCA, elenco piante tossiche e non tossiche (aspca.org)
autori: [piantalapp]
aggiornato: "2026-10-18"
