schema_version: 1
id: calathea
stato: bozza
nome_scientifico: Goeppertia makoyana
sinonimi:
- Calathea makoyana
famiglia: Marantaceae
nomi_comuni:
  it:
  - Calathea
  - Pianta pavone
  en:
  - Peacock plant
  - Calathea
  - Cathedral windows
descrizione: Foglie disegnate come piume di pavone, verde chiaro con macchie scure
  e rovescio porpora. La sera le foglie si alzano e al mattino si riaprono.
categorie:
- appartamento
- pet_friendly
gruppo: appartamento
ambiente:
  interno: true
  esterno: estate
  terrarium: 'no'
  note: Solo in casa, lontano da termosifoni e correnti d'aria; ama le stanze umide
    come il bagno.
difficolta: 3
luce:
  ideale: media_indiretta
  tollera:
  - bassa
  - intensa_indiretta
  sole_diretto: 'no'
  esposizione:
  - nord
  - est
  - ovest
annaffiatura:
  quando: Tieni il terriccio sempre appena umido, mai fradicio; usa acqua non calcarea.
  primavera_estate:
    min: 4
    max: 7
  autunno_inverno:
    min: 7
    max: 12
  segnali_troppa: Foglie che ingialliscono e marciscono alla base.
  segnali_poca: Foglie che si arrotolano e bordi bruciati.
umidita: alta
concimazione:
  mesi:
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  frequenza_giorni:
    min: 15
    max: 30
  tipo: Concime liquido per piante verdi a metà dose.
temperatura:
  min_c: 16
  ideale_min_c: 18
  ideale_max_c: 27
terreno: Terriccio leggero per piante verdi con torba e perlite.
rinvaso: Ogni 2 anni in primavera, in un vaso appena più grande.
propagazione:
- divisione
come_si_propaga:
- metodo: divisione
  quando: In primavera, durante il rinvaso.
  passi:
  - Sfila la pianta dal vaso e scuoti via parte del terriccio.
  - Separa con le mani o con un coltello pulito i cespi, ognuno con radici e foglie.
  - Rinvasa ogni parte in terriccio fresco e annaffia.
  - Tienila in luce indiretta per un paio di settimane, senza concimare.
  tempo: Riprende in 3-4 settimane.
  difficolta: facile
tossicita:
  animali: non_tossica
  persone: non_tossica
  note: Non tossica per cani e gatti secondo l'ASPCA.
problemi_comuni:
- sintomo: Punte e bordi delle foglie marroni e secchi
  causa: Aria troppo secca o acqua calcarea
  rimedio: Vaporizzare, usare un sottovaso con argilla umida e annaffiare con acqua
    piovana o demineralizzata.
- sintomo: Foglie puntinate di giallo con sottili ragnatele
  causa: Ragnetto rosso, favorito da aria secca e caldo
  rimedio: Lavare le foglie, aumentare l'umidità e, se serve, usare un acaricida.
immagini:
- commons: Calathea makoyana 11zz.jpg
fonti:
- Royal Horticultural Society, schede delle specie (rhs.org.uk)
- ASPCA, elenco piante tossiche e non tossiche (aspca.org)
- Missouri Botanical Garden, Plant Finder (missouribotanicalgarden.org)
autori:
- piantalapp
aggiornato: '2026-10-26'
