schema_version: 1
id: azalea
stato: bozza
nome_scientifico: Rhododendron simsii
famiglia: Ericaceae
nomi_comuni:
  it:
  - Azalea
  - Azalea indica
  en:
  - Indian azalea
  - Florist's azalea
descrizione: Cespuglio coperto di fiori rosa, rossi o bianchi in inverno e primavera.
  Venduta in vaso per le feste.
categorie:
- appartamento
- fiorita
- balcone
gruppo: appartamento
ambiente:
  interno: true
  esterno: estate
  terrarium: 'no'
  note: In fioritura in casa ma al fresco (10-16 °C). Da maggio a settembre fuori
    a mezz'ombra.
difficolta: 3
luce:
  ideale: intensa_indiretta
  tollera:
  - media_indiretta
  sole_diretto: solo_mattino
  esposizione:
  - est
  - ovest
annaffiatura:
  quando: 'Il terriccio non deve mai seccare: immergi il vaso in acqua piovana per
    10 minuti quando è leggero.'
  primavera_estate:
    min: 3
    max: 5
  autunno_inverno:
    min: 5
    max: 7
  segnali_troppa: Foglie gialle e molli, terriccio che resta bagnato.
  segnali_poca: Foglie flosce o che si arricciano, bordi secchi.
umidita: media
concimazione:
  mesi:
  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  frequenza_giorni:
    min: 15
    max: 30
  tipo: Concime per acidofile ogni 2 settimane, da marzo a settembre.
temperatura:
  min_c: 2
  ideale_min_c: 10
  ideale_max_c: 18
terreno: Terriccio acido per acidofile.
rinvaso: Ogni 2 anni in primavera, in un vaso appena più grande.
propagazione:
- talea_fusto
come_si_propaga:
- metodo: talea_fusto
  quando: In primavera o all'inizio dell'estate.
  passi:
  - Taglia una punta di 10-15 cm con 3-4 foglie, appena sotto un nodo.
  - Togli le foglie basse e, se vuoi, intingi il taglio in ormone radicante.
  - Interrala in un mix di torba e perlite e annaffia leggermente.
  - Copri con un sacchetto trasparente e tieni al caldo (22-25 °C) e alla luce indiretta.
  - Arieggia ogni pochi giorni; quando spuntano foglie nuove togli il sacchetto.
  tempo: Radici in 6-10 settimane.
  difficolta: difficile
tossicita:
  animali: tossica
  persone: tossica
  note: 'Tutta la pianta contiene graianotossine: per persone e animali causa vomito,
    debolezza e disturbi al cuore.'
problemi_comuni:
- sintomo: Fiori che durano pochissimo
  causa: Stanza troppo calda
  rimedio: Tenerla sotto i 16 °C.
- sintomo: Foglie gialle con nervature verdi
  causa: Clorosi per acqua calcarea
  rimedio: Usare acqua piovana e ferro chelato.
immagini:
- commons: Rhododendron simsii 01.JPG
fonti:
- Royal Horticultural Society, schede delle specie (rhs.org.uk)
- ASPCA, elenco piante tossiche e non tossiche (aspca.org)
- Missouri Botanical Garden, Plant Finder (missouribotanicalgarden.org)
autori:
- piantalapp
aggiornato: '2026-10-26'
