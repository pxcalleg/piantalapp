schema_version: 1
id: rhapis
stato: bozza
nome_scientifico: Rhapis excelsa
famiglia: Arecaceae
nomi_comuni:
  it:
  - Rhapis
  - Palma bambù
  - Palma signora
  en:
  - Lady palm
  - Broadleaf lady palm
descrizione: Palma a cespo con fusti fibrosi simili al bambù e foglie a ventaglio
  divise in dita. Robusta e longeva.
categorie:
- appartamento
- da_ufficio
- pet_friendly
gruppo: appartamento
ambiente:
  interno: true
  esterno: estate
  terrarium: 'no'
  note: In casa tutto l'anno; in estate può stare fuori all'ombra, al riparo dal
    vento.
difficolta: 1
luce:
  ideale: media_indiretta
  tollera:
  - bassa
  - intensa_indiretta
  sole_diretto: 'no'
  esposizione:
  - nord
  - est
  - ovest
annaffiatura:
  quando: Quando la superficie del terriccio è asciutta; d'inverno meno spesso.
  primavera_estate:
    min: 7
    max: 10
  autunno_inverno:
    min: 14
    max: 21
  segnali_troppa: Fronde gialle alla base e radici marce.
  segnali_poca: Punte delle fronde marroni e secche.
umidita: media
concimazione:
  mesi:
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  frequenza_giorni:
    min: 15
    max: 30
  tipo: Concime liquido per piante verdi a metà dose.
temperatura:
  min_c: 5
  ideale_min_c: 15
  ideale_max_c: 25
terreno: Terriccio per palme o universale con sabbia e perlite.
rinvaso: 'Ogni 2-3 anni: le palme non amano che si disturbino le radici.'
propagazione:
- divisione
- polloni
come_si_propaga:
- metodo: divisione
  quando: In primavera, durante il rinvaso.
  passi:
  - Sfila la pianta dal vaso e scuoti via parte del terriccio.
  - Separa con le mani o con un coltello pulito i cespi, ognuno con radici e foglie.
  - Rinvasa ogni parte in terriccio fresco e annaffia.
  - Tienila in luce indiretta per un paio di settimane, senza concimare.
  tempo: Riprende in 4-6 settimane.
  difficolta: facile
- metodo: polloni
  quando: In primavera o in estate.
  passi:
  - Aspetta che il pollone alla base sia alto almeno un terzo della pianta madre.
  - Staccalo con un coltello pulito tenendo un pezzo di radice o di base.
  - Interralo in un vasetto con terriccio leggero e drenante.
  - Tienilo appena umido e alla luce indiretta finché non riparte.
  tempo: Radica in 4-8 settimane.
  difficolta: facile
tossicita:
  animali: non_tossica
  persone: non_tossica
  note: Non tossica per cani e gatti secondo l'ASPCA.
problemi_comuni:
- sintomo: Batuffoli bianchi o scudetti sui rami
  causa: Cocciniglia
  rimedio: Togliere con un cotton fioc imbevuto di alcol e trattare con olio bianco
    o sapone molle.
immagini:
- commons: Rhapis excelsa 12zz.jpg
fonti:
- Royal Horticultural Society, schede delle specie (rhs.org.uk)
- ASPCA, elenco piante tossiche e non tossiche (aspca.org)
- Missouri Botanical Garden, Plant Finder (missouribotanicalgarden.org)
autori:
