schema_version: 1
id: gelsomino-polyanthum
stato: bozza
nome_scientifico: Jasminum polyanthum
famiglia: Oleaceae
nomi_comuni:
  it:
  - Gelsomino polyanthum
  - Gelsomino rosa
  en:
  - Pink jasmine
  - Chinese jasmine
descrizione: Rampicante con boccioli rosa e fiori bianchi a stella molto profumati,
  a fine inverno. Venduto spesso su un archetto.
categorie:
- appartamento
- fiorita
- balcone
- ricadente
- pet_friendly
gruppo: appartamento
ambiente:
  interno: true
  esterno: tutto_anno
  terrarium: 'no'
  note: 'Per fiorire vuole un periodo fresco in autunno: in casa mettilo nella stanza
    più fresca. Al Centro-Sud sta fuori tutto l''anno in un angolo riparato.'
difficolta: 2
luce:
  ideale: intensa_indiretta
  tollera:
  - sole_diretto
  - media_indiretta
  sole_diretto: solo_mattino
  esposizione:
  - est
  - sud
  - ovest
annaffiatura:
  quando: Quando i primi 2-3 cm di terriccio sono asciutti.
  primavera_estate:
    min: 7
    max: 10
  autunno_inverno:
    min: 12
    max: 18
  segnali_troppa: Foglie gialle e molli, terriccio che resta bagnato.
  segnali_poca: Foglie flosce o che si arricciano, bordi secchi.
umidita: media
concimazione:
  mesi:
  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
  frequenza_giorni:
    min: 15
    max: 30
  tipo: Concime liquido per piante verdi a metà dose.
temperatura:
  min_c: 0
  ideale_min_c: 10
  ideale_max_c: 22
terreno: Terriccio universale con perlite o corteccia.
rinvaso: Ogni 2 anni in primavera, in un vaso appena più grande.
propagazione:
- talea_fusto
- propaggine
come_si_propaga:
- metodo: talea_fusto
  quando: In primavera o all'inizio dell'estate.
  passi:
  - Taglia una punta di 10-15 cm con 3-4 foglie, appena sotto un nodo.
  - Togli le foglie basse e, se vuoi, intingi il taglio in ormone radicante.
  - Interrala in un mix di torba e perlite e annaffia leggermente.
  - Copri con un sacchetto trasparente e tieni al caldo (22-25 °C) e alla luce indiretta.
  - Arieggia ogni pochi giorni; quando spuntano foglie nuove togli il sacchetto.
  tempo: Radici in 4-6 settimane.
  difficolta: facile
- metodo: propaggine
  quando: In primavera o in estate.
  passi:
  - Piega un ramo flessibile fino al terriccio di un vasetto vicino.
  - Incidi leggermente la corteccia dove tocca il terriccio e fissalo con una forcina.
  - Tieni umido; dopo qualche settimana, quando ha radicato, taglialo dalla pianta
    madre.
  tempo: Radica in 6-8 settimane.
  difficolta: facile
tossicita:
  animali: non_tossica
  persone: non_tossica
  note: Non tossica per cani e gatti secondo l'ASPCA.
problemi_comuni:
- sintomo: Germogli coperti di piccoli insetti verdi o neri
  causa: Afidi
  rimedio: Lavare con un getto d'acqua o con sapone molle diluito.
- sintomo: Batuffoli bianchi o scudetti sui rami
  causa: Cocciniglia
  rimedio: Togliere con un cotton fioc imbevuto di alcol e trattare con olio bianco
    o sapone molle.
