schema_version: 1
id: capelvenere
stato: bozza
nome_scientifico: Adiantum raddianum
famiglia: Pteridaceae
nomi_comuni:
  it:
  - Capelvenere
  - Adianto
  en:
  - Maidenhair fern
  - Delta maidenhair fern
descrizione: Felce elegante con fronde leggere di foglioline a ventaglio su steli
  neri e sottili. È tra le più adatte ai terrari grandi, dove trova l'umidità che
  ama.
categorie:
- appartamento
- terrarium
- pet_friendly
gruppo: terrari
ambiente:
  interno: true
  esterno: 'no'
  terrarium: entrambi
  note: In vaso fuori dal terrarium va tenuta lontana dai termosifoni, in una stanza
    umida come il bagno.
difficolta: 4
luce:
  ideale: media_indiretta
  tollera:
  - bassa
  - intensa_indiretta
  sole_diretto: 'no'
  esposizione:
  - nord
  - est
annaffiatura:
  quando: Il terriccio non deve mai asciugarsi del tutto; usa acqua non calcarea.
  primavera_estate:
    min: 2
    max: 4
  autunno_inverno:
    min: 4
    max: 7
  segnali_troppa: Base delle fronde nera e marcia.
  segnali_poca: Fronde che seccano e si accartocciano in poche ore.
umidita: alta
concimazione:
  mesi:
  - 4
  - 5
  - 6
  - 7
  - 8
  frequenza_giorni:
    min: 30
    max: 30
  tipo: Concime liquido per piante verdi a un quarto di dose.
temperatura:
  min_c: 12
  ideale_min_c: 18
  ideale_max_c: 25
terreno: Terriccio torboso leggero con un po' di sabbia.
rinvaso: 'Ogni 2 anni in primavera. Taglia alla base le fronde secche: ne ricresceranno
  di nuove.'
propagazione:
- divisione
come_si_propaga:
- metodo: divisione
  quando: In primavera.
  passi:
  - Estrai la pianta dal vaso o scalza il cespo con la vanga.
  - Dividi la zolla in due o più parti, ognuna con radici e germogli.
  - Rinvasa ogni parte in terriccio fresco alla stessa profondità di prima.
  - Annaffia e tienila in mezz'ombra per qualche giorno.
  tempo: Riprende in 2-4 settimane.
  difficolta: facile
tossicita:
  animali: non_tossica
  persone: non_tossica
  note: Non tossica per cani e gatti secondo l'ASPCA.
immagini:
- commons: Starr 030807-0143 Adiantum raddianum.jpg
fonti:
- Royal Horticultural Society, schede delle specie (rhs.org.uk)
- ASPCA, elenco piante tossiche e non tossiche (aspca.org)
autori:
- piantalapp
aggiornato: '2026-10-26'
