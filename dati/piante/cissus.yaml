schema_version: 1
id: cissus
stato: bozza
nome_scientifico: Cissus rhombifolia
famiglia: Vitaceae
nomi_comuni:
  it:
  - Cissus
  - Edera d'appartamento
  - Vite d'appartamento
  en:
  - Grape ivy
  - Venezuela treebine
descrizione: Rampicante parente della vite, con foglie divise in tre lobi lucidi
  e viticci. Robusta e veloce.
categorie:
- appartamento
- ricadente
- da_ufficio
- pet_friendly
gruppo: appartamento
ambiente:
  interno: true
  esterno: estate
  terrarium: 'no'
  note: In casa tutto l'anno; in estate può stare fuori all'ombra, al riparo dal
    vento.
difficolta: 1
luce:
  ideale: media_indiretta
  tollera:
  - bassa
  - intensa_indiretta
  sole_diretto: 'no'
  esposizione:
  - nord
  - est
  - ovest
annaffiatura:
  quando: Quando i primi 2-3 cm di terriccio sono asciutti.
  primavera_estate:
    min: 7
    max: 10
  autunno_inverno:
    min: 12
    max: 18
  segnali_troppa: Foglie gialle e molli, terriccio che resta bagnato.
  segnali_poca: Foglie flosce o che si arricciano, bordi secchi.
umidita: media
concimazione:
  mesi:
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  frequenza_giorni:
    min: 15
    max: 30
  tipo: Concime liquido per piante verdi a metà dose.
temperatura:
  min_c: 10
  ideale_min_c: 16
  ideale_max_c: 26
terreno: Terriccio universale con perlite o corteccia.
rinvaso: Ogni 2 anni in primavera, in un vaso appena più grande.
propagazione:
- talea_in_acqua
- talea_fusto
come_si_propaga:
- metodo: talea_in_acqua
  quando: Da aprile a settembre, quando la pianta cresce.
  passi:
  - Taglia un pezzo di fusto di 10-15 cm con almeno un nodo e 2-3 foglie.
  - Togli la foglia più bassa, così il nodo resta nudo.
  - Mettilo in un bicchiere d'acqua con il nodo sommerso e le foglie fuori.
  - Tienilo alla luce indiretta e cambia l'acqua ogni 4-5 giorni.
  - Quando le radici sono lunghe 3-5 cm, interralo in un vasetto.
  tempo: Radici in 2-4 settimane.
  difficolta: facile
- metodo: talea_fusto
  quando: In primavera o all'inizio dell'estate.
  passi:
  - Taglia una punta di 10-15 cm con 3-4 foglie, appena sotto un nodo.
  - Togli le foglie basse e, se vuoi, intingi il taglio in ormone radicante.
  - Interrala in un mix di torba e perlite e annaffia leggermente.
  - Copri con un sacchetto trasparente e tieni al caldo (22-25 °C) e alla luce indiretta.
  - Arieggia ogni pochi giorni; quando spuntano foglie nuove togli il sacchetto.
  tempo: Radici in 3-4 settimane.
  difficolta: facile
tossicita:
  animali: non_tossica
  persone: non_tossica
  note: Non tossica per cani e gatti secondo l'ASPCA.
problemi_comuni:
- sintomo: Foglie puntinate di giallo con sottili ragnatele
  causa: Ragnetto rosso, favorito da aria secca e caldo
  rimedio: Lavare le foglie, aumentare l'umidità e, se serve, usare un acaricida.
immagini:
- commons: Cissus rhombifolia.jpg
fonti:
- Royal Horticultural Society, schede delle specie (rhs.org.uk)
- ASPCA, elenco piante tossiche e non tossiche (aspca.org)
- Missouri Botanical Garden, Plant Finder (missouribotanicalgarden.org)
autori:
- piantalapp
aggiornato: '2026-10-26'
