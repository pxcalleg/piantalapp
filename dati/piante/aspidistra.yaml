schema_version: 1
id: aspidistra
stato: bozza
nome_scientifico: Aspidistra elatior
famiglia: Asparagaceae
nomi_comuni:
  it:
  - Aspidistra
  - Pianta di ferro
  en:
  - Cast-iron plant
  - Bar-room plant
descrizione: 'Foglie lunghe, scure e coriacee che spuntano dal terriccio. Quasi
  indistruttibile: sopporta buio, freddo e dimenticanze.'
categorie:
- appartamento
- da_ufficio
- pet_friendly
gruppo: appartamento
ambiente:
  interno: true
  esterno: tutto_anno
  terrarium: 'no'
  note: In casa anche negli angoli più bui; nelle zone miti sta fuori tutto l'anno
    all'ombra.
difficolta: 1
luce:
  ideale: bassa
  tollera:
  - media_indiretta
  sole_diretto: 'no'
  esposizione:
  - nord
  - est
annaffiatura:
  quando: Quando i primi 2-3 cm di terriccio sono asciutti.
  primavera_estate:
    min: 10
    max: 14
  autunno_inverno:
    min: 21
    max: 30
  segnali_troppa: Foglie gialle e molli, terriccio che resta bagnato.
  segnali_poca: Foglie flosce o che si arricciano, bordi secchi.
umidita: bassa
concimazione:
  mesi:
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  frequenza_giorni:
    min: 15
    max: 30
  tipo: Concime liquido per piante verdi a metà dose.
temperatura:
  min_c: 0
  ideale_min_c: 10
  ideale_max_c: 24
terreno: Terriccio universale con perlite o corteccia.
rinvaso: Ogni 2 anni in primavera, in un vaso appena più grande.
propagazione:
- divisione
come_si_propaga:
- metodo: divisione
  quando: In primavera, durante il rinvaso.
  passi:
  - Sfila la pianta dal vaso e scuoti via parte del terriccio.
  - Separa con le mani o con un coltello pulito i cespi, ognuno con radici e foglie.
  - Rinvasa ogni parte in terriccio fresco e annaffia.
  - Tienila in luce indiretta per un paio di settimane, senza concimare.
  tempo: Riprende in 3-4 settimane.
  difficolta: facile
tossicita:
  animali: non_tossica
  persone: non_tossica
  note: Non tossica per cani e gatti secondo l'ASPCA.
problemi_comuni:
- sintomo: Foglie con macchie bianche bruciate
  causa: Sole diretto
  rimedio: Spostarla all'ombra.
immagini:
- commons: Aspidistra elatior - 01.jpg
fonti:
- Royal Horticultural Society, schede delle specie (rhs.org.uk)
- ASPCA, elenco piante tossiche e non tossiche (aspca.org)
- Missouri Botanical Garden, Plant Finder (missouribotanicalgarden.org)
autori:
- piantalapp
aggiornato: '2026-10-26'
