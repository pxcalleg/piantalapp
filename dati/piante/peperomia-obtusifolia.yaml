schema_version: 1
id: peperomia-obtusifolia
stato: bozza
nome_scientifico: Peperomia obtusifolia
famiglia: Piperaceae
nomi_comuni:
  it:
  - Peperomia obtusifolia
  - Peperomia
  en:
  - Baby rubber plant
  - American rubber plant
descrizione: Piccola pianta dalle foglie tonde, carnose e lucide, verdi o variegate
  di crema. Compatta e poco esigente.
categorie:
- appartamento
- da_ufficio
- pet_friendly
gruppo: appartamento
ambiente:
  interno: true
  esterno: estate
  terrarium: 'no'
  note: In casa tutto l'anno; in estate può stare fuori all'ombra, al riparo dal
    vento.
difficolta: 1
luce:
  ideale: media_indiretta
  tollera:
  - bassa
  - intensa_indiretta
  sole_diretto: 'no'
  esposizione:
  - nord
  - est
  - ovest
annaffiatura:
  quando: 'Quando il terriccio è asciutto per metà: le foglie carnose fanno riserva
    d''acqua.'
  primavera_estate:
    min: 10
    max: 14
  autunno_inverno:
    min: 18
    max: 25
  segnali_troppa: Foglie gialle e molli, terriccio che resta bagnato.
  segnali_poca: Foglie flosce o che si arricciano, bordi secchi.
umidita: media
concimazione:
  mesi:
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  frequenza_giorni:
    min: 15
    max: 30
  tipo: Concime liquido per piante verdi a metà dose.
temperatura:
  min_c: 12
  ideale_min_c: 18
  ideale_max_c: 26
terreno: Terriccio universale con molta perlite, leggero e drenante.
rinvaso: Ogni 2 anni in primavera, in un vaso appena più grande.
propagazione:
- talea_fusto
- talea_foglia
come_si_propaga:
- metodo: talea_fusto
  quando: In primavera o all'inizio dell'estate.
  passi:
  - Taglia una punta di 10-15 cm con 3-4 foglie, appena sotto un nodo.
  - Togli le foglie basse e, se vuoi, intingi il taglio in ormone radicante.
  - Interrala in un mix di torba e perlite e annaffia leggermente.
  - Copri con un sacchetto trasparente e tieni al caldo (22-25 °C) e alla luce indiretta.
  - Arieggia ogni pochi giorni; quando spuntano foglie nuove togli il sacchetto.
  tempo: Radici in 3-4 settimane.
  difficolta: facile
- metodo: talea_foglia
  quando: In primavera o in estate.
  passi:
  - Stacca una foglia sana con 2-3 cm di picciolo.
  - Interra il picciolo per 1 cm in terriccio leggero misto a perlite.
  - Copri con un sacchetto trasparente e tieni al caldo e alla luce indiretta.
  - Tieni il terriccio appena umido; separa le piantine quando hanno 3-4 foglie.
  tempo: Radici in 3-5 settimane, piantine dopo 2-3 mesi.
  difficolta: facile
tossicita:
  animali: non_tossica
  persone: non_tossica
  note: Non tossica per cani e gatti secondo l'ASPCA.
problemi_comuni:
- sintomo: Base del fusto molle e scura, pianta che appassisce
  causa: Marciume delle radici per troppa acqua
  rimedio: Ridurre le annaffiature, rinvasare in terriccio asciutto e drenante.
