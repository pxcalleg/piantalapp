schema_version: 1
id: hoya
stato: bozza
nome_scientifico: Hoya carnosa
famiglia: Apocynaceae
nomi_comuni:
  it:
  - Hoya
  - Fiore di cera
  en:
  - Wax plant
  - Porcelain flower
descrizione: Rampicante con foglie carnose e mazzetti di fiori a stella che sembrano
  di cera e profumano la sera.
categorie:
- appartamento
- ricadente
- fiorita
- pet_friendly
gruppo: appartamento
ambiente:
  interno: true
  esterno: estate
  terrarium: 'no'
  note: 'In casa, vicino a una finestra luminosa. Non tagliare i corti rami dei
    fiori: rifiorisce dagli stessi.'
difficolta: 2
luce:
  ideale: intensa_indiretta
  tollera:
  - media_indiretta
  sole_diretto: 'no'
  esposizione:
  - est
  - ovest
annaffiatura:
  quando: Solo quando il terriccio è asciutto quasi del tutto.
  primavera_estate:
    min: 10
    max: 14
  autunno_inverno:
    min: 21
    max: 30
  segnali_troppa: Base del fusto molle e foglie gialle che cadono.
  segnali_poca: Foglie raggrinzite o che si afflosciano.
umidita: media
concimazione:
  mesi:
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  frequenza_giorni:
    min: 30
    max: 30
  tipo: Concime per cactacee o per piante verdi a metà dose, una volta al mese.
temperatura:
  min_c: 10
  ideale_min_c: 16
  ideale_max_c: 27
terreno: Terriccio per cactacee e succulente, molto drenante.
rinvaso: Ogni 2 anni in primavera, in un vaso appena più grande.
propagazione:
- talea_in_acqua
- talea_fusto
come_si_propaga:
- metodo: talea_in_acqua
  quando: Da aprile a settembre, quando la pianta cresce.
  passi:
  - Taglia un pezzo di fusto di 10-15 cm con almeno un nodo e 2-3 foglie.
  - Togli la foglia più bassa, così il nodo resta nudo.
  - Mettilo in un bicchiere d'acqua con il nodo sommerso e le foglie fuori.
  - Tienilo alla luce indiretta e cambia l'acqua ogni 4-5 giorni.
  - Quando le radici sono lunghe 3-5 cm, interralo in un vasetto.
  tempo: Radici in 3-5 settimane.
  difficolta: facile
- metodo: talea_fusto
  quando: In primavera o all'inizio dell'estate.
  passi:
  - Taglia una punta di 10-15 cm con 3-4 foglie, appena sotto un nodo.
  - Togli le foglie basse e, se vuoi, intingi il taglio in ormone radicante.
  - Interrala in un mix di torba e perlite e annaffia leggermente.
  - Copri con un sacchetto trasparente e tieni al caldo (22-25 °C) e alla luce indiretta.
  - Arieggia ogni pochi giorni; quando spuntano foglie nuove togli il sacchetto.
  tempo: Radici in 4-6 settimane.
  difficolta: facile
tossicita:
  animali: non_tossica
  persone: non_tossica
  note: Non tossica per cani e gatti secondo l'ASPCA.
problemi_comuni:
- sintomo: Batuffoli bianchi o scudetti sui rami
  causa: Cocciniglia
  rimedio: Togliere con un cotton fioc imbevuto di alcol e trattare con olio bianco
    o sapone molle.
