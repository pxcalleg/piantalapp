schema_version: 1
id: beaucarnea
stato: bozza
nome_scientifico: Beaucarnea recurvata
sinonimi:
- Nolina recurvata
famiglia: Asparagaceae
nomi_comuni:
  it:
  - Beaucarnea
  - Piede d'elefante
  - Nolina
  en:
  - Ponytail palm
  - Elephant's foot
descrizione: Tronco gonfio alla base, che fa da serbatoio d'acqua, e un ciuffo di
  foglie lunghe e ricadenti come una coda di cavallo.
categorie:
- appartamento
- succulenta
- da_ufficio
- pet_friendly
gruppo: appartamento
ambiente:
  interno: true
  esterno: estate
  terrarium: 'no'
  note: In casa vicino a una finestra luminosa; d'estate anche fuori al sole.
difficolta: 1
luce:
  ideale: intensa_indiretta
  tollera:
  - media_indiretta
  - sole_diretto
  sole_diretto: solo_mattino
  esposizione:
  - est
  - sud
  - ovest
annaffiatura:
  quando: Solo quando il terriccio è asciutto quasi del tutto.
  primavera_estate:
    min: 14
    max: 21
  autunno_inverno:
    min: 30
    max: 45
  segnali_troppa: Base del fusto molle e foglie gialle che cadono.
  segnali_poca: Foglie raggrinzite o che si afflosciano.
umidita: bassa
concimazione:
  mesi:
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  frequenza_giorni:
    min: 30
    max: 30
  tipo: Concime per cactacee o per piante verdi a metà dose, una volta al mese.
temperatura:
  min_c: 8
  ideale_min_c: 15
  ideale_max_c: 28
terreno: Terriccio per cactacee e succulente, molto drenante.
rinvaso: Ogni 2 anni in primavera, in un vaso appena più grande.
propagazione:
- seme
- polloni
come_si_propaga:
- metodo: seme
  quando: In primavera, al caldo.
  passi:
  - Usa semi freschi e mettili a bagno in acqua tiepida per 12-24 ore.
  - Seminali poco profondi in terriccio da semina umido.
  - Copri con pellicola o un coperchio trasparente e tieni a 22-27 °C.
  - Quando le piantine hanno 2-3 foglie vere, trapiantale in vasetti singoli.
  tempo: Germina in 3-6 settimane; cresce molto lentamente.
  difficolta: media
- metodo: polloni
  quando: In primavera o in estate.
  passi:
  - Aspetta che il pollone alla base sia alto almeno un terzo della pianta madre.
  - Staccalo con un coltello pulito tenendo un pezzo di radice o di base.
  - Interralo in un vasetto con terriccio leggero e drenante.
  - Tienilo appena umido e alla luce indiretta finché non riparte.
  tempo: Radica in 4-8 settimane.
  difficolta: facile
tossicita:
  animali: non_tossica
  persone: non_tossica
  note: Non tossica per cani e gatti secondo l'ASPCA.
problemi_comuni:
- sintomo: Base del fusto molle e scura, pianta che appassisce
  causa: Marciume delle radici per troppa acqua
  rimedio: Ridurre le annaffiature, rinvasare in terriccio asciutto e drenante.
