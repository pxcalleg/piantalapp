schema_version: 1
id: opuntia
stato: bozza
nome_scientifico: Opuntia microdasys
famiglia: Cactaceae
nomi_comuni:
  it: [Fico d'India nano, Orecchie di coniglio, Opunzia]
  en: [Bunny ears cactus, Angel's wings]
descrizione: >-
  Cactus fatto di pale piatte e ovali una sopra l'altra, senza spine lunghe
  ma con fitti ciuffetti gialli di glochidi, peli sottilissimi che si
  staccano al tocco e pungono.
categorie: [appartamento, balcone, succulenta]
ambiente:
  interno: true
  esterno: estate
  terrarium: "no"
  note: >-
    D'estate fuori in pieno sole; ritirarla prima delle notti fredde, sotto
    i 7-10 °C, e tenerla all'asciutto d'inverno.
difficolta: 1
luce:
  ideale: sole_diretto
  tollera: [intensa_indiretta]
  sole_diretto: si
  esposizione: [sud, ovest]
  note: Con poca luce le pale nuove crescono strette, lunghe e pallide.
annaffiatura:
  quando: Solo quando il terriccio è completamente asciutto; d'inverno quasi mai.
  primavera_estate: { min: 10, max: 21 }
  autunno_inverno: { min: 30, max: 60 }
  metodo: Annaffiare a fondo il terriccio, lasciare scolare e non lasciare acqua nel sottovaso.
  segnali_troppa: Pale giallastre e molli, base scura.
  segnali_poca: Pale raggrinzite e sottili.
umidita: bassa
concimazione:
  mesi: [4, 5, 6, 7, 8]
  frequenza_giorni: { min: 30, max: 30 }
  tipo: Concime per cactus a metà dose.
temperatura:
  min_c: 7
  ideale_min_c: 15
  ideale_max_c: 35
terreno: Terriccio per cactus con pomice o sabbia grossa.
rinvaso: Ogni 2-3 anni in primavera; usare guanti spessi o un panno ripiegato per non riempirsi di glochidi.
propagazione: [talea_fusto, seme]
tossicita:
  animali: non_tossica
  persone: non_tossica
  note: >-
    Non è velenosa, ma i glochidi si staccano al minimo tocco e irritano la
    pelle e gli occhi; tenerla lontana da bambini e animali.
problemi_comuni:
  - sintomo: Pale nuove strette e allungate
    causa: Luce insufficiente
    rimedio: Più sole diretto; le pale filate si possono staccare e usare come talee.
  - sintomo: Glochidi nella pelle
    causa: Contatto con le pale
    rimedio: Toglierli con nastro adesivo o con uno strato di colla vinilica lasciata asciugare e poi staccata.
  - sintomo: Base delle pale scura e molle
    causa: Marciume da troppa acqua
    rimedio: Salvare le pale sane come talee e cambiare terriccio.
immagini:
  - commons: "OpuntiaMicrodasys.jpg"
fonti:
  - Royal Horticultural Society, scheda Opuntia microdasys (rhs.org.uk)
  - University of Florida IFAS Extension, Opuntia microdasys (edis.ifas.ufl.edu)
  - ASPCA, elenco piante tossiche e non tossiche (aspca.org)
autori: [piantalapp]
aggiornato: "2026-10-18"
