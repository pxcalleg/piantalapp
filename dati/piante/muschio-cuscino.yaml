schema_version: 1
id: muschio-cuscino
stato: bozza
nome_scientifico: Leucobryum glaucum
famiglia: Leucobryaceae
nomi_comuni:
  it:
  - Muschio a cuscino
  - Muschio
  en:
  - Pincushion moss
  - Cushion moss
descrizione: Muschio che forma cuscinetti tondi verde chiaro, usato nei terrari
  chiusi e nei bonsai per dare l'effetto di un sottobosco.
categorie:
- terrarium
- pet_friendly
gruppo: terrari
ambiente:
  interno: true
  esterno: 'no'
  terrarium: chiuso
  note: Dà il meglio in un terrarium chiuso; non raccoglierlo nei boschi protetti,
    compralo coltivato.
difficolta: 2
luce:
  ideale: media_indiretta
  tollera:
  - bassa
  - intensa_indiretta
  sole_diretto: 'no'
  esposizione:
  - nord
  - est
annaffiatura:
  quando: Nebulizza acqua piovana o distillata quando schiarisce e diventa più grigio.
  primavera_estate:
    min: 3
    max: 5
  autunno_inverno:
    min: 5
    max: 7
  segnali_troppa: Muffa bianca sopra il cuscino.
  segnali_poca: Diventa grigio, secco e croccante.
umidita: alta
concimazione:
  mesi:
  - 5
  frequenza_giorni:
    min: 365
    max: 365
  tipo: Non serve mai.
temperatura:
  min_c: 2
  ideale_min_c: 12
  ideale_max_c: 24
terreno: Si appoggia su terriccio acido o direttamente su sassi e legno.
rinvaso: Non va rinvasato; si stacca e si sposta a pezzi.
propagazione:
- divisione
come_si_propaga:
- metodo: divisione
  quando: Tutto l'anno.
  passi:
  - Stacca un pezzo di cuscino.
  - Appoggialo sul substrato umido e premilo.
  - Nebulizza spesso finché non si attacca.
  tempo: Attecchisce in 3-6 settimane.
  difficolta: facile
tossicita:
  animali: non_tossica
  persone: non_tossica
  note: Non tossico.
immagini:
- commons: Leucobryum glaucum 2.jpg
fonti:
- Royal Horticultural Society, schede delle specie (rhs.org.uk)
- ASPCA, elenco piante tossiche e non tossiche (aspca.org)
autori:
- piantalapp
aggiornato: '2026-10-26'
