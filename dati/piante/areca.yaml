schema_version: 1
id: areca
stato: bozza
nome_scientifico: Dypsis lutescens
sinonimi:
- Chrysalidocarpus lutescens
famiglia: Arecaceae
nomi_comuni:
  it:
  - Areca
  - Palma d'oro
  en:
  - Areca palm
  - Butterfly palm
  - Golden cane palm
descrizione: Palma a cespuglio con tanti fusti gialli e fronde arcuate. Ama la luce
  e un'aria non troppo secca.
categorie:
- appartamento
- da_ufficio
- pet_friendly
gruppo: appartamento
ambiente:
  interno: true
  esterno: estate
  terrarium: 'no'
  note: In casa tutto l'anno; in estate può stare fuori all'ombra, al riparo dal
    vento.
difficolta: 2
luce:
  ideale: intensa_indiretta
  tollera:
  - media_indiretta
  sole_diretto: 'no'
  esposizione:
  - est
  - ovest
annaffiatura:
  quando: Quando la superficie del terriccio è asciutta; d'inverno meno spesso.
  primavera_estate:
    min: 7
    max: 10
  autunno_inverno:
    min: 14
    max: 21
  segnali_troppa: Fronde gialle alla base e radici marce.
  segnali_poca: Punte delle fronde marroni e secche.
umidita: media
concimazione:
  mesi:
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  frequenza_giorni:
    min: 15
    max: 30
  tipo: Concime liquido per piante verdi a metà dose.
temperatura:
  min_c: 13
  ideale_min_c: 18
  ideale_max_c: 27
terreno: Terriccio per palme o universale con sabbia e perlite.
rinvaso: 'Ogni 2-3 anni: le palme non amano che si disturbino le radici.'
propagazione:
- divisione
come_si_propaga:
- metodo: divisione
  quando: In primavera, durante il rinvaso.
  passi:
  - Sfila la pianta dal vaso e scuoti via parte del terriccio.
  - Separa con le mani o con un coltello pulito i cespi, ognuno con radici e foglie.
  - Rinvasa ogni parte in terriccio fresco e annaffia.
  - Tienila in luce indiretta per un paio di settimane, senza concimare.
  tempo: Riprende in 3-4 settimane.
  difficolta: facile
tossicita:
  animali: non_tossica
  persone: non_tossica
  note: Non tossica per cani e gatti secondo l'ASPCA.
problemi_comuni:
- sintomo: Foglie puntinate di giallo con sottili ragnatele
  causa: Ragnetto rosso, favorito da aria secca e caldo
  rimedio: Lavare le foglie, aumentare l'umidità e, se serve, usare un acaricida.
- sintomo: Punte e bordi delle foglie marroni e secchi
  causa: Aria troppo secca o acqua calcarea
  rimedio: Vaporizzare, usare un sottovaso con argilla umida e annaffiare con acqua
    piovana o demineralizzata.
immagini:
- commons: Dypsis lutescens 21zz.jpg
fonti:
- Royal Horticultural Society, schede delle specie (rhs.org.uk)
- ASPCA, elenco piante tossiche e non tossiche (aspca.org)
- Missouri Botanical Garden, Plant Finder (missouribotanicalgarden.org)
autori:
- piantalapp
aggiornato: '2026-10-26'
