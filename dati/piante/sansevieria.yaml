schema_version: 1
id: sansevieria
stato: bozza
nome_scientifico: Dracaena trifasciata
sinonimi: [Sansevieria trifasciata]
famiglia: Asparagaceae
nomi_comuni:
  it: [Sansevieria, Lingua di suocera]
  en: [Snake plant, Mother-in-law's tongue]
descrizione: >-
  Pianta dalle foglie erette, rigide e succulente. Sopporta poca luce e
  dimenticanze, ma non i ristagni d'acqua.
categorie: [appartamento, succulenta, da_ufficio]
ambiente:
  interno: true
  esterno: estate
  terrarium: "no"
  note: D'estate può stare fuori al riparo dalla pioggia; ritirarla sotto i 10 °C.
difficolta: 1
luce:
  ideale: intensa_indiretta
  tollera: [bassa, media_indiretta, sole_diretto]
  sole_diretto: si
  esposizione: [nord, est, sud, ovest]
  note: Si adatta quasi ovunque; al sole pieno va abituata gradualmente.
annaffiatura:
  quando: Solo quando il terriccio è completamente asciutto, anche in profondità.
  primavera_estate: { min: 14, max: 21 }
  autunno_inverno: { min: 30, max: 45 }
  metodo: Bagnare il terriccio evitando di versare acqua al centro della rosetta.
  segnali_troppa: Foglie molli, che si piegano o marciscono alla base.
  segnali_poca: Foglie raggrinzite e sottili.
umidita: bassa
concimazione:
  mesi: [4, 5, 6, 7, 8, 9]
  frequenza_giorni: { min: 30, max: 60 }
  tipo: Concime per piante grasse a metà dose.
temperatura:
  min_c: 10
  ideale_min_c: 18
  ideale_max_c: 30
terreno: Terriccio per piante grasse, oppure universale con 40% di sabbia o pomice.
rinvaso: Ogni 3-4 anni; preferisce vasi stretti e pesanti, in terracotta.
propagazione: [divisione, talea_foglia]
come_si_propaga:
  - metodo: divisione
    quando: In primavera o inizio estate, di solito al momento del rinvaso.
    passi:
      - Annaffia poco il giorno prima, poi sfila la pianta dal vaso e togli il terriccio in eccesso dalle radici.
      - Individua i ciuffi di foglie collegati dal rizoma (il fusto sotterraneo) e separali con un coltello pulito, lasciando a ognuno radici proprie.
      - Lascia asciugare i tagli all'aria per 1-2 giorni.
      - Invasa ogni ciuffo in un vaso stretto con terriccio per piante grasse e aspetta una settimana prima di annaffiare.
    tempo: Si assesta in 3-4 settimane.
    difficolta: facile
    note: È l'unico metodo che mantiene il bordo giallo delle varietà variegate come 'Laurentii'.
  - metodo: talea_foglia
    quando: Da aprile ad agosto, con temperature sopra i 20 °C.
    passi:
      - Taglia una foglia sana alla base e dividila in pezzi di 5-8 cm, segnando quale lato era in basso (i pezzi capovolti non radicano).
      - Lascia asciugare i pezzi all'aria per 2-3 giorni, finché il taglio fa una pellicina.
      - Interra ogni pezzo per 2 cm, con il lato basso giù, in terriccio per piante grasse misto a sabbia o pomice.
      - Tieni in luce indiretta e al caldo, annaffiando poco e solo quando il terriccio è asciutto.
      - Quando spunta un germoglio alla base del pezzo, lascialo crescere qualche mese prima di spostarlo in un vaso suo.
    tempo: Radici in 4-8 settimane; il primo germoglio può richiedere 2-3 mesi.
    difficolta: media
    note: Nelle varietà con il bordo giallo, le nuove piante nate da talea di foglia escono tutte verdi.
tossicita:
  animali: lieve
  persone: lieve
  note: Contiene saponine; se ingerita può causare nausea e vomito.
problemi_comuni:
  - sintomo: Base delle foglie molle e scura, cattivo odore
    causa: Marciume radicale da troppa acqua
    rimedio: Togliere dal vaso, eliminare le parti marce, lasciare asciugare e rinvasare in terriccio asciutto.
  - sintomo: Le talee di foglia producono piante senza bordo giallo
    causa: Normale con la talea fogliare nelle varietà variegate
    rimedio: Per mantenere la variegatura propagare per divisione.
immagini:
  - commons: "Snake plant.jpg"
fonti:
  - Royal Horticultural Society, scheda Dracaena trifasciata (rhs.org.uk)
  - ASPCA, elenco piante tossiche e non tossiche (aspca.org)
autori: [piantalapp]
aggiornato: "2026-10-18"
