schema_version: 1
id: guzmania
stato: bozza
nome_scientifico: Guzmania lingulata
famiglia: Bromeliaceae
nomi_comuni:
  it:
  - Guzmania
  en:
  - Scarlet star
  - Droophead tufted airplant
descrizione: Rosetta di foglie lucide con al centro una stella di brattee rosse,
  arancioni o gialle che dura mesi.
categorie:
- appartamento
- fiorita
- pet_friendly
gruppo: appartamento
ambiente:
  interno: true
  esterno: estate
  terrarium: 'no'
  note: In casa tutto l'anno; in estate può stare fuori all'ombra, al riparo dal
    vento.
difficolta: 2
luce:
  ideale: intensa_indiretta
  tollera:
  - media_indiretta
  sole_diretto: 'no'
  esposizione:
  - est
  - ovest
annaffiatura:
  quando: Tieni un dito d'acqua nel vaso centrale della rosetta e cambiala ogni
    2 settimane; il terriccio solo appena umido.
  primavera_estate:
    min: 7
    max: 10
  autunno_inverno:
    min: 12
    max: 18
  segnali_troppa: Base della rosetta che marcisce.
  segnali_poca: Punte delle foglie secche e vaso centrale vuoto.
umidita: media
concimazione:
  mesi:
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  frequenza_giorni:
    min: 30
    max: 30
  tipo: Concime per orchidee molto diluito, nel vaso centrale o vaporizzato sulle
    foglie.
temperatura:
  min_c: 15
  ideale_min_c: 18
  ideale_max_c: 27
terreno: Terriccio leggero per bromelie o per orchidee, con corteccia.
rinvaso: 'Raramente: la pianta madre muore dopo la fioritura e si tengono i polloni.'
propagazione:
- polloni
come_si_propaga:
- metodo: polloni
  quando: In primavera o in estate.
  passi:
  - Aspetta che il pollone alla base sia alto almeno un terzo della pianta madre.
  - Staccalo con un coltello pulito tenendo un pezzo di radice o di base.
  - Interralo in un vasetto con terriccio leggero e drenante.
  - Tienilo appena umido e alla luce indiretta finché non riparte.
  tempo: Fiorisce dopo 2-3 anni.
  difficolta: facile
tossicita:
  animali: non_tossica
  persone: non_tossica
  note: Non tossica per cani e gatti secondo l'ASPCA.
problemi_comuni:
- sintomo: La rosetta secca dopo la fioritura
  causa: Ciclo naturale delle bromelie
  rimedio: Tenere i polloni alla base e trapiantarli quando sono alti un terzo della
    madre.
immagini:
- commons: Scarlet Star (Guzmania lingulata) (2857478111).jpg
fonti:
- Royal Horticultural Society, schede delle specie (rhs.org.uk)
- ASPCA, elenco piante tossiche e non tossiche (aspca.org)
- Missouri Botanical Garden, Plant Finder (missouribotanicalgarden.org)
autori:
- piantalapp
aggiornato: '2026-10-26'
