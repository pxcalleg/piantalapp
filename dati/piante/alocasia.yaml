schema_version: 1
id: alocasia
stato: bozza
nome_scientifico: Alocasia × amazonica
famiglia: Araceae
nomi_comuni:
  it:
  - Alocasia
  - Alocasia amazonica
  - Orecchie d'elefante
  en:
  - African mask plant
  - Elephant ear
  - Alocasia Polly
descrizione: 'Foglie a scudo verde scurissimo con nervature bianche in rilievo.
  Spettacolare ma delicata: d''inverno può riposare e perdere le foglie.'
categorie:
- appartamento
gruppo: appartamento
ambiente:
  interno: true
  esterno: estate
  terrarium: 'no'
  note: Solo in casa, lontano da termosifoni e correnti d'aria; ama le stanze umide
    come il bagno.
difficolta: 4
luce:
  ideale: intensa_indiretta
  tollera:
  - media_indiretta
  sole_diretto: 'no'
  esposizione:
  - est
  - ovest
annaffiatura:
  quando: Quando i primi 2-3 cm sono asciutti; d'inverno molto meno.
  primavera_estate:
    min: 5
    max: 7
  autunno_inverno:
    min: 10
    max: 14
  segnali_troppa: Foglie che ingialliscono e marciscono alla base.
  segnali_poca: Foglie che si arrotolano e bordi bruciati.
umidita: alta
concimazione:
  mesi:
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  frequenza_giorni:
    min: 15
    max: 30
  tipo: Concime liquido per piante verdi a metà dose.
temperatura:
  min_c: 16
  ideale_min_c: 18
  ideale_max_c: 28
terreno: Terriccio leggero per piante verdi con torba e perlite.
rinvaso: Ogni 2 anni in primavera, in un vaso appena più grande.
propagazione:
- divisione
come_si_propaga:
- metodo: divisione
  quando: In primavera, durante il rinvaso.
  passi:
  - Sfila la pianta dal vaso e separa i cespi, ognuno con radici e almeno una foglia.
  - Al rinvaso cerca i piccoli bulbi (cormi) tra le radici.
  - Mettili su sfagno o perlite umida in un contenitore chiuso, al caldo.
  - Quando spuntano radici e una fogliolina, interrali in un vasetto.
  tempo: Germogliano in 1-3 mesi.
  difficolta: media
tossicita:
  animali: tossica
  persone: tossica
  note: 'Contiene ossalato di calcio: se masticata irrita bocca e gola di persone
    e animali. Il gonfiore può essere forte: tienila lontana da bambini e animali.'
problemi_comuni:
- sintomo: Foglie puntinate di giallo con sottili ragnatele
  causa: Ragnetto rosso, favorito da aria secca e caldo
  rimedio: Lavare le foglie, aumentare l'umidità e, se serve, usare un acaricida.
- sintomo: Base del fusto molle e scura, pianta che appassisce
  causa: Marciume delle radici per troppa acqua
  rimedio: Ridurre le annaffiature, rinvasare in terriccio asciutto e drenante.
immagini:
- commons: Alocasia x amazonica a1.jpg
fonti:
- Royal Horticultural Society, schede delle specie (rhs.org.uk)
- ASPCA, elenco piante tossiche e non tossiche (aspca.org)
- Missouri Botanical Garden, Plant Finder (missouribotanicalgarden.org)
autori:
- piantalapp
aggiornato: '2026-10-26'
