schema_version: 1
id: echeveria
stato: bozza
nome_scientifico: Echeveria elegans
famiglia: Crassulaceae
nomi_comuni:
  it: [Echeveria, Rosa di alabastro, Rosa di pietra]
  en: [Mexican snowball, White Mexican rose]
descrizione: >-
  Rosetta compatta di foglie carnose a spatola, azzurro-grigie e coperte di
  pruina, con la punta rosata. In primavera fa steli arcuati con
  campanelline rosa e gialle.
categorie: [appartamento, balcone, succulenta, pet_friendly]
ambiente:
  interno: true
  esterno: estate
  terrarium: "no"
  note: >-
    Fuori da primavera ad autunno, al sole e al riparo dalla pioggia; nelle
    zone a inverno mite resta fuori se all'asciutto e sopra i 5 °C.
difficolta: 2
luce:
  ideale: sole_diretto
  tollera: [intensa_indiretta]
  sole_diretto: si
  esposizione: [sud, ovest, est]
  note: >-
    È la succulenta che soffre di più la poca luce: il fusto si allunga,
    la rosetta si apre e perde il colore azzurro.
annaffiatura:
  quando: Quando il terriccio è completamente asciutto; le foglie leggermente meno sode indicano sete.
  primavera_estate: { min: 10, max: 14 }
  autunno_inverno: { min: 30, max: 45 }
  metodo: Bagnare il terriccio senza lasciare acqua tra le foglie della rosetta; svuotare il sottovaso.
  segnali_troppa: Foglie gonfie, traslucide e giallastre che si staccano.
  segnali_poca: Foglie esterne raggrinzite e sottili.
umidita: bassa
concimazione:
  mesi: [4, 5, 6, 7, 8]
  frequenza_giorni: { min: 30, max: 45 }
  tipo: Concime per piante grasse a metà dose.
temperatura:
  min_c: 5
  ideale_min_c: 15
  ideale_max_c: 28
terreno: Terriccio per piante grasse con molta pomice o lapillo.
rinvaso: Ogni 2 anni in primavera, in vasi bassi di terracotta.
propagazione: [talea_foglia, divisione, seme]
tossicita:
  animali: non_tossica
  persone: non_tossica
  note: Le echeverie sono considerate non tossiche per cani e gatti.
problemi_comuni:
  - sintomo: Fusto lungo con foglie distanziate
    causa: Luce insufficiente
    rimedio: Tagliare la rosetta con un pezzo di fusto, lasciarla asciugare qualche giorno e ripiantarla al sole.
  - sintomo: Foglie basse che seccano
    causa: Normale ricambio della pianta
    rimedio: Toglierle quando sono secche, per evitare marciumi e parassiti.
  - sintomo: Batuffoli bianchi tra le foglie
    causa: Cocciniglia farinosa
    rimedio: Togliere con un cotton fioc imbevuto di alcol.
immagini:
  - commons: "Rosa de alabastro (Echeveria elegans), Calatayud, España 2012-05-16, DD 01.JPG"
fonti:
  - Royal Horticultural Society, scheda Echeveria elegans (rhs.org.uk)
  - ASPCA, elenco piante tossiche e non tossiche, voce Echeveria (aspca.org)
  - North Carolina State University Extension Gardener Plant Toolbox, Echeveria elegans (plants.ces.ncsu.edu)
autori: [piantalapp]
aggiornato: "2026-10-18"
