schema_version: 1
id: begonia-maculata
stato: bozza
nome_scientifico: Begonia maculata
famiglia: Begoniaceae
nomi_comuni:
  it:
  - Begonia maculata
  - Begonia a pois
  en:
  - Polka dot begonia
  - Spotted begonia
descrizione: Foglie ad ala d'angelo verde oliva a pois argentati con rovescio rosso.
  Fusti a canna e grappoli di fiori bianchi.
categorie:
- appartamento
- fiorita
gruppo: appartamento
ambiente:
  interno: true
  esterno: estate
  terrarium: 'no'
  note: Solo in casa, lontano da termosifoni e correnti d'aria; ama le stanze umide
    come il bagno.
difficolta: 3
luce:
  ideale: intensa_indiretta
  tollera:
  - media_indiretta
  sole_diretto: 'no'
  esposizione:
  - est
  - ovest
annaffiatura:
  quando: Quando i primi 2-3 cm sono asciutti; non lasciarla fradicia.
  primavera_estate:
    min: 5
    max: 7
  autunno_inverno:
    min: 10
    max: 14
  segnali_troppa: Foglie che ingialliscono e marciscono alla base.
  segnali_poca: Foglie che si arrotolano e bordi bruciati.
umidita: media
concimazione:
  mesi:
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  frequenza_giorni:
    min: 15
    max: 30
  tipo: Concime liquido per piante verdi a metà dose.
temperatura:
  min_c: 16
  ideale_min_c: 18
  ideale_max_c: 27
terreno: Terriccio leggero per piante verdi con torba e perlite.
rinvaso: Ogni 2 anni in primavera, in un vaso appena più grande.
propagazione:
- talea_in_acqua
- talea_fusto
come_si_propaga:
- metodo: talea_in_acqua
  quando: Da aprile a settembre, quando la pianta cresce.
  passi:
  - Taglia un pezzo di fusto di 10-15 cm con almeno un nodo e 2-3 foglie.
  - Togli la foglia più bassa, così il nodo resta nudo.
  - Mettilo in un bicchiere d'acqua con il nodo sommerso e le foglie fuori.
  - Tienilo alla luce indiretta e cambia l'acqua ogni 4-5 giorni.
  - Quando le radici sono lunghe 3-5 cm, interralo in un vasetto.
  tempo: Radici in 2-3 settimane.
  difficolta: facile
- metodo: talea_fusto
  quando: In primavera o all'inizio dell'estate.
  passi:
  - Taglia una punta di 10-15 cm con 3-4 foglie, appena sotto un nodo.
  - Togli le foglie basse e, se vuoi, intingi il taglio in ormone radicante.
  - Interrala in un mix di torba e perlite e annaffia leggermente.
  - Copri con un sacchetto trasparente e tieni al caldo (22-25 °C) e alla luce indiretta.
  - Arieggia ogni pochi giorni; quando spuntano foglie nuove togli il sacchetto.
  tempo: Radici in 3-4 settimane.
  difficolta: facile
tossicita:
  animali: tossica
  persone: lieve
  note: 'Contiene ossalati solubili, soprattutto nei rizomi: per gli animali causa
    irritazione e vomito.'
problemi_comuni:
- sintomo: Patina bianca polverosa sulle foglie
  causa: Oidio (mal bianco)
  rimedio: Togliere le foglie colpite, arieggiare e non bagnare il fogliame.
- sintomo: Fusti lunghi e spogli in basso
  causa: Crescita normale delle begonie a canna
  rimedio: Cimare in primavera e ripiantare le punte nello stesso vaso.
immagini:
- commons: Begonia maculata Raddi 01.jpg
