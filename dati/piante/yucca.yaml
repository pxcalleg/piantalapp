famiglia: Asparagaceae
nomi_comuni:
  it:
  - Yucca
  - Yucca elefante
  en:
  - Spineless yucca
  - Giant yucca
descrizione: Tronco legnoso con ciuffi di foglie lunghe e rigide, senza spine. Vuole
  tanta luce e poca acqua.
categorie:
- appartamento
- da_ufficio
gruppo: appartamento
ambiente:
  interno: true
  esterno: estate
  terrarium: 'no'
  note: In casa vicino alla finestra più luminosa; in estate sta benissimo fuori
    al sole.
difficolta: 1
luce:
  ideale: intensa_indiretta
  tollera:
  - media_indiretta
  - sole_diretto
  sole_diretto: solo_mattino
  esposizione:
  - est
  - sud
  - ovest
annaffiatura:
  quando: Solo quando il terriccio è asciutto quasi del tutto.
  primavera_estate:
    min: 10
    max: 14
  autunno_inverno:
    min: 21
    max: 30
  segnali_troppa: Base del fusto molle e foglie gialle che cadono.
  segnali_poca: Foglie raggrinzite o che si afflosciano.
umidita: bassa
concimazione:
  mesi:
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  frequenza_giorni:
    min: 30
    max: 30
  tipo: Concime per cactacee o per piante verdi a metà dose, una volta al mese.
temperatura:
  min_c: 5
  ideale_min_c: 15
  ideale_max_c: 28
terreno: Terriccio per cactacee e succulente, molto drenante.
rinvaso: Ogni 2 anni in primavera, in un vaso appena più grande.
propagazione:
- talea_fusto
- polloni
come_si_propaga:
- metodo: talea_fusto
  quando: In primavera o all'inizio dell'estate.
  passi:
  - Taglia una punta di 10-15 cm con 3-4 foglie, appena sotto un nodo.
  - Togli le foglie basse e, se vuoi, intingi il taglio in ormone radicante.
  - Interrala in un mix di torba e perlite e annaffia leggermente.
  - Copri con un sacchetto trasparente e tieni al caldo (22-25 °C) e alla luce indiretta.
  - Arieggia ogni pochi giorni; quando spuntano foglie nuove togli il sacchetto.
  tempo: Radici in 4-8 settimane.
  difficolta: facile
- metodo: polloni
  quando: In primavera o in estate.
  passi:
  - Aspetta che il pollone alla base sia alto almeno un terzo della pianta madre.
  - Staccalo con un coltello pulito tenendo un pezzo di radice o di base.
  - Interralo in un vasetto con terriccio leggero e drenante.
  - Tienilo appena umido e alla luce indiretta finché non riparte.
  tempo: Radica in 4-8 settimane.
  difficolta: facile
tossicita:
  animali: tossica
  persone: lieve
  note: 'Contiene saponine: per cani e gatti provoca vomito e salivazione.'
problemi_comuni:
- sintomo: Base del fusto molle e scura, pianta che appassisce
  causa: Marciume delle radici per troppa acqua
  rimedio: Ridurre le annaffiature, rinvasare in terriccio asciutto e drenante.
- sintomo: Batuffoli bianchi o scudetti sui rami
  causa: Cocciniglia
  rimedio: Togliere con un cotton fioc imbevuto di alcol e trattare con olio bianco
    o sapone molle.
