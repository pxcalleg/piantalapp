schema_version: 1
id: pothos
stato: bozza
nome_scientifico: Epipremnum aureum
sinonimi: [Scindapsus aureus, Pothos aureus]
famiglia: Araceae
nomi_comuni:
  it: [Pothos, Potos]
  en: [Pothos, Golden pothos, Devil's ivy]
descrizione: >-
  Rampicante o ricadente dalle foglie a cuore, verdi o variegate.
  Robustissima, ideale per chi inizia.
categorie: [appartamento, ricadente, da_ufficio]
gruppo: appartamento
ambiente:
  interno: true
  esterno: "no"
  terrarium: aperto
  note: >-
    In Italia va tenuto in casa; all'aperto solo in estate e in ombra.
    Piccole talee si usano anche nei terrarium aperti e grandi.
difficolta: 1
luce:
  ideale: media_indiretta
  tollera: [bassa, intensa_indiretta]
  sole_diretto: "no"
  esposizione: [nord, est, ovest]
  note: >-
    Con poca luce sopravvive ma rallenta e le varietà variegate perdono il
    disegno giallo o bianco. Il sole diretto brucia le foglie.
annaffiatura:
  quando: Quando metà del terriccio è asciutto; le foglie leggermente mosce indicano sete.
  primavera_estate: { min: 7, max: 10 }
  autunno_inverno: { min: 14, max: 21 }
  metodo: Annaffiare a fondo e non lasciare acqua nel sottovaso.
  segnali_troppa: Foglie gialle alla base, fusti molli e scuri vicino al terriccio.
  segnali_poca: Foglie flosce e bordi marroni secchi.
umidita: media
concimazione:
  mesi: [4, 5, 6, 7, 8, 9]
  frequenza_giorni: { min: 30, max: 30 }
  tipo: Concime liquido per piante verdi a metà dose.
temperatura:
  min_c: 15
  ideale_min_c: 18
  ideale_max_c: 29
terreno: Terriccio universale con perlite o corteccia per mantenerlo arioso.
rinvaso: Ogni 2 anni o quando le radici escono dai fori.
propagazione: [talea_in_acqua, talea_fusto]
come_si_propaga:
  - metodo: talea_in_acqua
    quando: Da aprile a settembre, quando la pianta cresce attivamente.
    passi:
      - Taglia con forbici pulite un pezzo di fusto lungo 10-15 cm con 2-4 foglie, appena sotto un nodo (il punto dove nasce la foglia e spesso una radichetta aerea marrone).
      - Togli la foglia più bassa, in modo che il nodo resti nudo.
      - Metti la talea in un bicchiere d'acqua a temperatura ambiente, con il nodo sott'acqua e le foglie fuori.
      - Tienila in un punto luminoso ma senza sole diretto e cambia l'acqua ogni 4-5 giorni.
      - Quando le radici sono lunghe 3-5 cm, trasferiscila in un vasetto con terriccio universale e perlite e tienilo umido per le prime settimane.
    tempo: Radici visibili in 2-3 settimane; pronta per il vaso in 4-6 settimane.
    difficolta: facile
    note: Una foglia staccata senza nodo può fare radici ma non darà mai una nuova pianta. Metti 3-4 talee nello stesso vaso per avere subito una pianta folta.
  - metodo: talea_fusto
    quando: Da aprile a settembre, con temperature sopra i 20 °C.
    passi:
      - Taglia una punta di 10-15 cm con almeno 2 nodi e 2-3 foglie, con forbici pulite.
      - Togli la foglia più bassa e interra la talea in un vasetto di terriccio universale misto a perlite, con almeno un nodo sotto terra.
      - Annaffia leggermente e copri il vaso con un sacchetto di plastica trasparente per tenere alta l'umidità.
      - Tienilo al caldo (20-25 °C) e in luce indiretta, arieggiando ogni pochi giorni e mantenendo il terriccio appena umido.
      - Quando spuntano foglie nuove togli il sacchetto e trattala come una pianta adulta.
    tempo: Radici in 3-4 settimane.
    difficolta: facile
tossicita:
  animali: tossica
  persone: lieve
  note: Contiene ossalato di calcio; se masticata irrita bocca e gola di persone e animali.
problemi_comuni:
  - sintomo: Foglie nuove sempre più piccole e fusti lunghi e spogli
    causa: Luce insufficiente
    rimedio: Avvicinare a una finestra luminosa e accorciare i fusti per farla infittire.
  - sintomo: Variegatura che sparisce
    causa: Poca luce
    rimedio: Spostare in un punto più luminoso, sempre senza sole diretto.
immagini:
  - commons: "Pothos epipremnum aureus.jpg"
fonti:
  - Royal Horticultural Society, scheda Epipremnum aureum (rhs.org.uk)
  - ASPCA, elenco piante tossiche e non tossiche (aspca.org)
autori: [piantalapp]
aggiornato: "2026-10-23"
