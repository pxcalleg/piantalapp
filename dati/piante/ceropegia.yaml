schema_version: 1
id: ceropegia
stato: bozza
nome_scientifico: Ceropegia woodii
famiglia: Apocynaceae
nomi_comuni:
  it:
  - Ceropegia
  - Collana di cuori
  en:
  - String of hearts
  - Rosary vine
descrizione: Ricadente con fili sottili e foglioline a cuore marmorizzate d'argento.
  Bellissima in un vaso appeso.
categorie:
- appartamento
- succulenta
- ricadente
- pet_friendly
gruppo: appartamento
ambiente:
  interno: true
  esterno: estate
  terrarium: 'no'
  note: In casa tutto l'anno; in estate può stare fuori all'ombra, al riparo dal
    vento.
difficolta: 2
luce:
  ideale: intensa_indiretta
  tollera:
  - media_indiretta
  - sole_diretto
  sole_diretto: solo_mattino
  esposizione:
  - est
  - sud
  - ovest
annaffiatura:
  quando: Solo quando il terriccio è asciutto quasi del tutto.
  primavera_estate:
    min: 10
    max: 14
  autunno_inverno:
    min: 21
    max: 30
  segnali_troppa: Base del fusto molle e foglie gialle che cadono.
  segnali_poca: Foglie raggrinzite o che si afflosciano.
umidita: bassa
concimazione:
  mesi:
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  frequenza_giorni:
    min: 30
    max: 30
  tipo: Concime per cactacee o per piante verdi a metà dose, una volta al mese.
temperatura:
  min_c: 10
  ideale_min_c: 15
  ideale_max_c: 27
terreno: Terriccio per cactacee e succulente, molto drenante.
rinvaso: Ogni 2 anni in primavera, in un vaso appena più grande.
propagazione:
- talea_in_acqua
- talea_fusto
come_si_propaga:
- metodo: talea_in_acqua
  quando: Da aprile a settembre, quando la pianta cresce.
  passi:
  - Taglia un pezzo di fusto di 10-15 cm con almeno un nodo e 2-3 foglie.
  - Togli la foglia più bassa, così il nodo resta nudo.
  - Mettilo in un bicchiere d'acqua con il nodo sommerso e le foglie fuori.
  - Tienilo alla luce indiretta e cambia l'acqua ogni 4-5 giorni.
  - Quando le radici sono lunghe 3-5 cm, interralo in un vasetto.
  tempo: Radici in 2-3 settimane.
  difficolta: facile
- metodo: talea_fusto
  quando: In primavera o in estate.
  passi:
  - Appoggia un tratto di filo sul terriccio di un vasetto vicino, senza tagliarlo.
  - Fissalo con una forcina in modo che i nodi o i tuberini tocchino il terriccio.
  - Tieni appena umido; quando radica, taglia il filo dalla pianta madre.
  tempo: Radica in 2-4 settimane.
  difficolta: facile
tossicita:
  animali: non_tossica
  persone: non_tossica
  note: Non tossica per cani e gatti secondo l'ASPCA.
problemi_comuni:
- sintomo: Base del fusto molle e scura, pianta che appassisce
  causa: Marciume delle radici per troppa acqua
  rimedio: Ridurre le annaffiature, rinvasare in terriccio asciutto e drenante.
- sintomo: Fusti lunghi e foglie piccole e distanziate
  causa: Luce insufficiente
  rimedio: Spostare la pianta in un punto più luminoso, senza sole diretto nelle
    ore calde.
immagini:
- commons: Ceropegia woodii 01.jpg
fonti:
- Royal Horticultural Society, schede delle specie (rhs.org.uk)
- ASPCA, elenco piante tossiche e non tossiche (aspca.org)
- Missouri Botanical Garden, Plant Finder (missouribotanicalgarden.org)
autori:
