schema_version: 1
id: aloe-vera
stato: bozza
nome_scientifico: Aloe vera
sinonimi: [Aloe barbadensis]
famiglia: Asphodelaceae
nomi_comuni:
  it: [Aloe vera, Aloe]
  en: [Aloe vera, Medicinal aloe]
descrizione: >-
  Rosetta di foglie spesse e carnose, grigio-verdi, con macchioline chiare
  da giovane e piccoli denti sul bordo. Ama il sole e teme solo l'acqua in
  eccesso e il freddo.
categorie: [appartamento, balcone, succulenta]
ambiente:
  interno: true
  esterno: estate
  terrarium: "no"
  note: >-
    Da maggio a settembre sta benissimo fuori, al sole e al riparo dalle
    piogge lunghe; ritirarla quando la notte scende sotto i 10 °C.
difficolta: 1
luce:
  ideale: sole_diretto
  tollera: [intensa_indiretta]
  sole_diretto: si
  esposizione: [sud, ovest, est]
  note: >-
    Con poca luce le foglie si allungano, si appiattiscono e si piegano.
    Dopo l'inverno in casa va riabituata al sole pieno un po' alla volta.
annaffiatura:
  quando: Solo quando il terriccio è completamente asciutto, anche in profondità.
  primavera_estate: { min: 14, max: 21 }
  autunno_inverno: { min: 30, max: 45 }
  metodo: Annaffiare a fondo il terriccio, senza bagnare il centro della rosetta, e svuotare il sottovaso.
  segnali_troppa: Foglie gonfie, molli e traslucide, base scura.
  segnali_poca: Foglie sottili che si incurvano verso l'interno, punte secche.
umidita: bassa
concimazione:
  mesi: [4, 5, 6, 7, 8, 9]
  frequenza_giorni: { min: 30, max: 60 }
  tipo: Concime per piante grasse a metà dose.
temperatura:
  min_c: 10
  ideale_min_c: 18
  ideale_max_c: 30
terreno: Terriccio per piante grasse, oppure universale con almeno un terzo di pomice o sabbia grossa.
rinvaso: Ogni 2-3 anni in primavera, in un vaso di terracotta poco più largo, con fori di drenaggio.
propagazione: [divisione]
tossicita:
  animali: tossica
  persone: lieve
  note: >-
    Il lattice giallo sotto la buccia contiene antrachinoni: se ingerito
    causa vomito e diarrea in cani e gatti, e ha effetto lassativo nelle
    persone. Il gel interno, usato sulla pelle, è in genere ben tollerato.
problemi_comuni:
  - sintomo: Foglie rosso-brune
    causa: Stress da sole forte o da sete
    rimedio: Un po' d'ombra nelle ore calde e un'annaffiatura a fondo; torna verde in qualche settimana.
  - sintomo: Foglie lunghe, piatte e piegate verso la finestra
    causa: Luce insufficiente
    rimedio: Spostarla nel punto più luminoso della casa o fuori d'estate.
  - sintomo: Base molle e scura
    causa: Marciume da troppa acqua
    rimedio: Togliere dal vaso, eliminare le parti marce, lasciare asciugare e rinvasare in terriccio asciutto.
immagini:
  - commons: "Aloe vera plant.JPG"
fonti:
  - Royal Horticultural Society, scheda Aloe vera (rhs.org.uk)
  - ASPCA, elenco piante tossiche e non tossiche, voce Aloe (aspca.org)
  - University of Florida IFAS Extension, Aloe vera (edis.ifas.ufl.edu)
autori: [piantalapp]
aggiornato: "2026-10-18"
