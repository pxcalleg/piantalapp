schema_version: 1
id: clivia
stato: bozza
nome_scientifico: Clivia miniata
famiglia: Amaryllidaceae
nomi_comuni:
  it:
  - Clivia
  en:
  - Natal lily
  - Bush lily
  - Kaffir lily
descrizione: Foglie nastriformi scure e, a fine inverno, un mazzo di fiori arancioni
  a trombetta. Fiorisce meglio se tenuta stretta nel vaso.
categorie:
- appartamento
- fiorita
gruppo: appartamento
ambiente:
  interno: true
  esterno: estate
  terrarium: 'no'
  note: In casa tutto l'anno; per fiorire vuole un inverno fresco (10-12 °C) e asciutto
    per circa due mesi.
difficolta: 2
luce:
  ideale: media_indiretta
  tollera:
  - intensa_indiretta
  sole_diretto: 'no'
  esposizione:
  - est
  - ovest
annaffiatura:
  quando: Quando il terriccio è asciutto per metà; da novembre a gennaio quasi niente.
  primavera_estate:
    min: 7
    max: 10
  autunno_inverno:
    min: 21
    max: 30
  segnali_troppa: Foglie gialle e molli, terriccio che resta bagnato.
  segnali_poca: Foglie flosce o che si arricciano, bordi secchi.
umidita: media
concimazione:
  mesi:
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  frequenza_giorni:
    min: 15
    max: 30
  tipo: Concime liquido per piante fiorite ogni 2 settimane durante la fioritura.
temperatura:
  min_c: 5
  ideale_min_c: 12
  ideale_max_c: 24
terreno: Terriccio universale con perlite o corteccia.
rinvaso: 'Ogni 3-4 anni, dopo la fioritura: ama stare stretta.'
propagazione:
- polloni
come_si_propaga:
- metodo: polloni
  quando: In primavera o in estate.
  passi:
  - Aspetta che il pollone alla base sia alto almeno un terzo della pianta madre.
  - Staccalo con un coltello pulito tenendo un pezzo di radice o di base.
  - Interralo in un vasetto con terriccio leggero e drenante.
  - Tienilo appena umido e alla luce indiretta finché non riparte.
  tempo: Fiorisce dopo 2-3 anni.
  difficolta: facile
tossicita:
  animali: tossica
  persone: tossica
  note: 'Contiene licorina, soprattutto nella base: se ingerita causa vomito e diarrea.'
problemi_comuni:
- sintomo: Non fiorisce
  causa: Inverno troppo caldo
  rimedio: Tenerla al fresco e quasi asciutta da novembre a gennaio.
- sintomo: Batuffoli bianchi o scudetti sui rami
  causa: Cocciniglia
  rimedio: Togliere con un cotton fioc imbevuto di alcol e trattare con olio bianco
    o sapone molle.
immagini:
- commons: Clivia miniata (BG Zurich)-06.JPG
fonti:
- Royal Horticultural Society, schede delle specie (rhs.org.uk)
- ASPCA, elenco piante tossiche e non tossiche (aspca.org)
- Missouri Botanical Garden, Plant Finder (missouribotanicalgarden.org)
autori:
- piantalapp
aggiornato: '2026-10-26'
