schema_version: 1
id: aglaonema
stato: bozza
nome_scientifico: Aglaonema commutatum
famiglia: Araceae
nomi_comuni:
  it:
  - Aglaonema
  - Sempreverde cinese
  en:
  - Chinese evergreen
  - Aglaonema
descrizione: Cespuglio di foglie lanceolate variegate d'argento, rosa o crema. Una
  delle piante che sopporta meglio la poca luce.
categorie:
- appartamento
- da_ufficio
gruppo: appartamento
ambiente:
  interno: true
  esterno: estate
  terrarium: 'no'
  note: In casa tutto l'anno; in estate può stare fuori all'ombra, al riparo dal
    vento.
difficolta: 1
luce:
  ideale: bassa
  tollera:
  - media_indiretta
  sole_diretto: 'no'
  esposizione:
  - nord
  - est
  - ovest
annaffiatura:
  quando: Quando i primi 2-3 cm di terriccio sono asciutti.
  primavera_estate:
    min: 7
    max: 10
  autunno_inverno:
    min: 12
    max: 18
  segnali_troppa: Foglie gialle e molli, terriccio che resta bagnato.
  segnali_poca: Foglie flosce o che si arricciano, bordi secchi.
umidita: media
concimazione:
  mesi:
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  frequenza_giorni:
    min: 15
    max: 30
  tipo: Concime liquido per piante verdi a metà dose.
temperatura:
  min_c: 15
  ideale_min_c: 18
  ideale_max_c: 27
terreno: Terriccio universale con perlite o corteccia.
rinvaso: Ogni 2 anni in primavera, in un vaso appena più grande.
propagazione:
- divisione
- talea_in_acqua
come_si_propaga:
- metodo: divisione
  quando: In primavera, durante il rinvaso.
  passi:
  - Sfila la pianta dal vaso e scuoti via parte del terriccio.
  - Separa con le mani o con un coltello pulito i cespi, ognuno con radici e foglie.
  - Rinvasa ogni parte in terriccio fresco e annaffia.
  - Tienila in luce indiretta per un paio di settimane, senza concimare.
  tempo: Riprende in 3-4 settimane.
  difficolta: facile
- metodo: talea_in_acqua
  quando: Da aprile a settembre, quando la pianta cresce.
  passi:
  - Taglia un pezzo di fusto di 10-15 cm con almeno un nodo e 2-3 foglie.
  - Togli la foglia più bassa, così il nodo resta nudo.
  - Mettilo in un bicchiere d'acqua con il nodo sommerso e le foglie fuori.
  - Tienilo alla luce indiretta e cambia l'acqua ogni 4-5 giorni.
  - Quando le radici sono lunghe 3-5 cm, interralo in un vasetto.
  tempo: Radici in 4-6 settimane.
  difficolta: facile
tossicita:
  animali: tossica
  persone: lieve
  note: 'Contiene ossalato di calcio: se masticata irrita bocca e gola di persone
    e animali.'
problemi_comuni:
- sintomo: Foglie con macchie marroni dopo l'inverno
  causa: Freddo sotto i 15 °C o correnti d'aria
  rimedio: Spostare lontano da finestre aperte e porte.
- sintomo: Base del fusto molle e scura, pianta che appassisce
  causa: Marciume delle radici per troppa acqua
  rimedio: Ridurre le annaffiature, rinvasare in terriccio asciutto e drenante.
