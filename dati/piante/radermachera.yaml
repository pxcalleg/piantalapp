schema_version: 1
id: radermachera
stato: bozza
nome_scientifico: Radermachera sinica
famiglia: Bignoniaceae
nomi_comuni:
  it:
  - Radermachera
  - Albero smeraldo
  en:
  - China doll
  - Emerald tree
  - Serpent tree
descrizione: Alberello dalle foglie composte, lucide e finemente divise, che danno
  un aspetto leggero e arioso.
categorie:
- appartamento
- pet_friendly
gruppo: appartamento
ambiente:
  interno: true
  esterno: estate
  terrarium: 'no'
  note: 'In casa vicino a una finestra luminosa, senza spostarla: se cambia posto
    perde le foglie.'
difficolta: 3
luce:
  ideale: intensa_indiretta
  tollera:
  - media_indiretta
  sole_diretto: 'no'
  esposizione:
  - est
  - ovest
annaffiatura:
  quando: Quando i primi 2-3 cm di terriccio sono asciutti.
  primavera_estate:
    min: 7
    max: 10
  autunno_inverno:
    min: 12
    max: 18
  segnali_troppa: Foglie gialle e molli, terriccio che resta bagnato.
  segnali_poca: Foglie flosce o che si arricciano, bordi secchi.
umidita: media
concimazione:
  mesi:
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  frequenza_giorni:
    min: 15
    max: 30
  tipo: Concime liquido per piante verdi a metà dose.
temperatura:
  min_c: 13
  ideale_min_c: 18
  ideale_max_c: 26
terreno: Terriccio universale con perlite o corteccia.
rinvaso: Ogni 2 anni in primavera, in un vaso appena più grande.
propagazione:
- talea_fusto
come_si_propaga:
- metodo: talea_fusto
  quando: In primavera o all'inizio dell'estate.
  passi:
  - Taglia una punta di 10-15 cm con 3-4 foglie, appena sotto un nodo.
  - Togli le foglie basse e, se vuoi, intingi il taglio in ormone radicante.
  - Interrala in un mix di torba e perlite e annaffia leggermente.
  - Copri con un sacchetto trasparente e tieni al caldo (22-25 °C) e alla luce indiretta.
  - Arieggia ogni pochi giorni; quando spuntano foglie nuove togli il sacchetto.
  tempo: Radici in 6-8 settimane.
  difficolta: media
tossicita:
  animali: non_tossica
  persone: non_tossica
  note: Non tossica per cani e gatti secondo l'ASPCA.
problemi_comuni:
- sintomo: Foglie che cadono in massa
  causa: Spostamento o poca luce
  rimedio: Trovarle un posto luminoso e stabile.
- sintomo: Batuffoli bianchi o scudetti sui rami
  causa: Cocciniglia
  rimedio: Togliere con un cotton fioc imbevuto di alcol e trattare con olio bianco
    o sapone molle.
immagini:
- commons: Radermachera sinica kz2.JPG
fonti:
- Royal Horticultural Society, schede delle specie (rhs.org.uk)
- ASPCA, elenco piante tossiche e non tossiche (aspca.org)
- Missouri Botanical Garden, Plant Finder (missouribotanicalgarden.org)
autori:
