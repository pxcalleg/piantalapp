schema_version: 1
id: platicerio
stato: bozza
nome_scientifico: Platycerium bifurcatum
famiglia: Polypodiaceae
nomi_comuni:
  it:
  - Platicerio
  - Felce corna d'alce
  en:
  - Staghorn fern
  - Elkhorn fern
descrizione: Felce epifita con fronde biforcute come corna di cervo e uno scudo
  di foglie tonde alla base. Si coltiva anche appesa su una tavoletta.
categorie:
- appartamento
- pet_friendly
gruppo: appartamento
ambiente:
  interno: true
  esterno: estate
  terrarium: 'no'
  note: Solo in casa, lontano da termosifoni e correnti d'aria; ama le stanze umide
    come il bagno.
difficolta: 3
luce:
  ideale: intensa_indiretta
  tollera:
  - media_indiretta
  sole_diretto: 'no'
  esposizione:
  - est
  - ovest
annaffiatura:
  quando: Immergi la base nell'acqua per 10-15 minuti quando lo sfagno è asciutto.
  primavera_estate:
    min: 7
    max: 10
  autunno_inverno:
    min: 14
    max: 21
  segnali_troppa: Foglie che ingialliscono e marciscono alla base.
  segnali_poca: Foglie che si arrotolano e bordi bruciati.
umidita: alta
concimazione:
  mesi:
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  frequenza_giorni:
    min: 15
    max: 30
  tipo: Concime liquido per piante verdi a un quarto della dose.
temperatura:
  min_c: 12
  ideale_min_c: 16
  ideale_max_c: 24
terreno: Sfagno e corteccia per orchidee, oppure montata su legno.
rinvaso: 'Raramente: quando lo scudo copre tutto il supporto, si fissa su una tavola
  più grande.'
propagazione:
- polloni
come_si_propaga:
- metodo: polloni
  quando: In primavera o in estate.
  passi:
  - Aspetta che il pollone alla base sia alto almeno un terzo della pianta madre.
  - Staccalo con un coltello pulito tenendo un pezzo di radice o di base.
  - Interralo in un vasetto con terriccio leggero e drenante.
  - Tienilo appena umido e alla luce indiretta finché non riparte.
  tempo: Si stabilizza in 1-2 mesi.
  difficolta: facile
tossicita:
  animali: non_tossica
  persone: non_tossica
  note: Non tossica per cani e gatti secondo l'ASPCA.
problemi_comuni:
- sintomo: Fronde annerite alla base
  causa: Troppa acqua
  rimedio: Lasciar asciugare il supporto tra un bagno e l'altro.
immagini:
- commons: Platycerium bifurcatum kz01.jpg
fonti:
- Royal Horticultural Society, schede delle specie (rhs.org.uk)
- ASPCA, elenco piante tossiche e non tossiche (aspca.org)
- Missouri Botanical Garden, Plant Finder (missouribotanicalgarden.org)
autori:
- piantalapp
aggiornato: '2026-10-26'
