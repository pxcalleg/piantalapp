schema_version: 1
id: peperomia-caperata
stato: bozza
nome_scientifico: Peperomia caperata
famiglia: Piperaceae
nomi_comuni:
  it:
  - Peperomia caperata
  - Peperomia
  en:
  - Emerald ripple peperomia
descrizione: Piccola pianta compatta dalle foglie a cuore increspate, verdi o rosse,
  con curiose spighe bianche. Cresce piano e sta bene nei terrari aperti.
categorie:
- appartamento
- terrarium
- da_ufficio
- pet_friendly
gruppo: terrari
ambiente:
  interno: true
  esterno: 'no'
  terrarium: aperto
  note: Sta bene anche in un vasetto sulla scrivania.
difficolta: 2
luce:
  ideale: media_indiretta
  tollera:
  - intensa_indiretta
  - bassa
  sole_diretto: 'no'
  esposizione:
  - est
  - ovest
  - nord
annaffiatura:
  quando: 'Quando il terriccio è asciutto a metà vaso: le foglie carnose tengono
    riserve.'
  primavera_estate:
    min: 7
    max: 10
  autunno_inverno:
    min: 14
    max: 21
  segnali_troppa: Base del fusto molle e foglie che cadono.
  segnali_poca: Foglie molli e raggrinzite.
umidita: media
concimazione:
  mesi:
  - 4
  - 5
  - 6
  - 7
  - 8
  frequenza_giorni:
    min: 30
    max: 30
  tipo: Concime liquido a metà dose.
temperatura:
  min_c: 13
  ideale_min_c: 18
  ideale_max_c: 27
terreno: Terriccio leggero con perlite.
rinvaso: 'Ogni 2-3 anni: le radici sono piccole e amano i vasi stretti.'
propagazione:
- talea_foglia
come_si_propaga:
- metodo: talea_foglia
  quando: In primavera o estate.
  passi:
  - Stacca una foglia con 2-3 cm di picciolo.
  - Interra il picciolo in terriccio e perlite umidi.
  - Copri con un sacchetto e tieni alla luce indiretta.
  tempo: Nascono piantine in 4-8 settimane.
  difficolta: facile
tossicita:
  animali: non_tossica
  persone: non_tossica
  note: Non tossica per cani e gatti secondo l'ASPCA.
immagini:
- commons: Peperomia caperata 'Rosso'.jpg
fonti:
- Royal Horticultural Society, schede delle specie (rhs.org.uk)
- ASPCA, elenco piante tossiche e non tossiche (aspca.org)
autori:
- piantalapp
aggiornato: '2026-10-26'
