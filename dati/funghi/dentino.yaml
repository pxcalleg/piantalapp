schema_version: 1
id: dentino
stato: bozza
nome_scientifico: Hydnum repandum
famiglia: Hydnaceae
nomi_comuni:
  it: [Dentino, Steccherino dorato, Lingua di gatto]
  en: [Hedgehog mushroom, Wood hedgehog]
descrizione: >-
  Fungo color camoscio che sotto il cappello, al posto delle lamelle, ha tanti
  piccoli aculei simili a denti. Proprio questi aculei lo rendono facile da
  distinguere.
commestibilita: commestibile
note_commestibilita: >-
  Buon commestibile da giovane e ben cotto; gli esemplari vecchi diventano
  amarognoli. Gli aculei si staccano facilmente e si possono togliere prima
  di cucinarlo.
habitat: >-
  Boschi di latifoglie e di conifere, spesso in gruppi o in file e cerchi,
  dalla collina alla montagna.
stagione: [7, 8, 9, 10, 11]
caratteristiche:
  cappello: >-
    Da 3 a 15 cm, crema, camoscio o arancio pallido, carnoso e irregolare,
    con il bordo spesso ondulato.
  sotto_il_cappello: >-
    Aculei fitti e fragili, lunghi pochi millimetri, color crema, che scendono
    un poco sul gambo.
  gambo: Corto e robusto, biancastro, spesso non centrato sotto il cappello.
  carne: >-
    Bianca, soda ma fragile, che ingiallisce lentamente al taglio; sapore
    dolce da giovane, amarognolo da vecchio.
  sporata: Bianca
sosia:
  - nome: Dentino rossiccio
    nome_scientifico: Hydnum rufescens
    commestibilita: commestibile
    differenze: >-
      Più piccolo e di colore arancio rossiccio, con gambo più slanciato e
      aculei che non scendono sul gambo.
  - nome: Idnello
    nome_scientifico: Hydnellum ferrugineum
    commestibilita: non_commestibile
    differenze: >-
      Anche lui ha aculei, ma è duro e legnoso, bruno ruggine e spesso con
      goccioline rossastre sul cappello; cresce sotto le conifere.
curiosita: >-
  È uno dei funghi con meno sosia pericolosi: per questo le associazioni
  micologiche lo indicano spesso a chi inizia, sempre con il controllo
  dell'Ispettorato micologico.
immagini:
  - commons: "Hydnum repandum 1.jpg"
fonti:
  - Ministero della Salute, funghi e Ispettorati micologici (salute.gov.it)
  - Associazione Micologica Bresadola, schede delle specie (ambbresadola.it)
autori: [piantalapp]
aggiornato: "2026-10-23"
