name: Valida dati piante

on:
  pull_request:
    paths: ["dati/**", "schema/**", "scripts/**"]
  push:
    branches: [main]
    paths: ["dati/**", "schema/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  valida:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/valida.py
      - name: Controlla le foto
        if: github.event_name == 'pull_request'
        run: python scripts/immagini.py --verifica
      # Su main (o se lanciato a mano) scarica le foto da Wikimedia Commons,
      # rigenera il pacchetto letto dall'app e salva tutto da solo, così chi
      # contribuisce deve modificare solo i file YAML.
      - name: Scarica le foto
        if: github.event_name != 'pull_request'
        run: python scripts/immagini.py
      - name: Aggiorna i dati dell'app
        if: github.event_name != 'pull_request'
        run: |
          python scripts/valida.py --build --out app/assets/piante.json
          git add app/assets
          if git diff --cached --quiet; then
            echo "Dati dell'app già aggiornati"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aggiorna foto e dati dell'app"
          git push
