name: Valida dati piante

on:
  pull_request:
    paths: ["dati/**", "schema/**", "scripts/**"]
  push:
    branches: [main]

jobs:
  valida:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/valida.py --build
      - uses: actions/upload-artifact@v4
        with:
          name: piante-json
          path: dist/piante.json
