name: App Android

on:
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --dart-define=PLANTNET_API_KEY=${{ secrets.PLANTNET_API_KEY }}
      - run: flutter build web --release --base-href /piantalapp/ --no-web-resources-cdn --dart-define=PLANTNET_API_KEY=${{ secrets.PLANTNET_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: piantalapp-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      # Pacchetto per il Play Store, solo quando c'è la chiave di caricamento
      # (secret PLAY_UPLOAD_KEYSTORE in base64 e PLAY_UPLOAD_KEYSTORE_PASSWORD).
      # Il numero di versione cresce a ogni build, come chiede Google Play.
      - name: Pacchetto per il Play Store
        env:
          PLAY_UPLOAD_KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          PIANTALAPP_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PLAY_UPLOAD_KEYSTORE" ]; then
            echo "Chiave di caricamento non ancora configurata: salto il pacchetto per il Play Store."
            exit 0
          fi
          echo "$PLAY_UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/caricamento.jks"
          PIANTALAPP_KEYSTORE="$RUNNER_TEMP/caricamento.jks" flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --dart-define=PLANTNET_API_KEY=${{ secrets.PLANTNET_API_KEY }}
          rm "$RUNNER_TEMP/caricamento.jks"
      - uses: actions/upload-artifact@v4
        if: hashFiles('app/build/app/outputs/bundle/release/app-release.aab') != ''
        with:
          name: piantalapp-play-store
          path: app/build/app/outputs/bundle/release/app-release.aab
      # Su main l'ultimo APK viene pubblicato nella release "anteprima",
      # da cui si scarica e installa direttamente dal telefono.
      - name: Pubblica l'APK di anteprima
        if: github.event_name == 'push'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk PiantalAPP.apk
          git tag -f anteprima
          git push -f origin anteprima
          gh release view anteprima >/dev/null 2>&1 || \
            gh release create anteprima --prerelease --title "Anteprima" \
              --notes "Ultima versione di prova dell'app, costruita dal ramo main. Scarica PiantalAPP.apk sul telefono Android e aprilo per installarlo."
          gh release upload anteprima PiantalAPP.apk --clobber
